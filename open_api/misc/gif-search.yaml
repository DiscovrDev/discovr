get:
  tags:
    - Discovr
    - Misc
  summary: Search GIFs
  x-tier: public
  security: [] # Public endpoint - no authentication required
  description: |
    Searches for animated GIFs by keyword. Use the `contentfilter` parameter to control content safety (`off`, `low`, `medium`, `high`); if you omit it, the filtering configured for Discovr's Klipy account applies, which is not a fixed level, so pass it explicitly when you need a guaranteed one. Results are paginated — pass `next` from the previous response as `pos` to load more.

    Each result's `url` is the full-size file and is an **MP4 whenever one is available**, otherwise a GIF, so render it with a video player or an image view according to its file extension (see `avatarMediaType` on profiles). `preview.url` is a lighter version for grids; use it for thumbnails and save `url` only for the one the user picks.

    Klipy attribution is required wherever you show these results.

    No authentication required.
  operationId: searchGifs
  # Third-party GIF results are effectively static; cache by the hour.
  x-cache-policy: "ttl:3600"
  parameters:
    - name: q
      in: query
      required: true
      description: Search term.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: "happy dance"
    - name: limit
      in: query
      required: false
      description: Maximum number of results to return (1–50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 20
    - name: pos
      in: query
      required: false
      description: Pagination cursor from the `next` field of the previous response. Omit to start from the beginning.
      schema:
        type: string
      example: "1:20"
    - name: contentfilter
      in: query
      required: false
      x-ts-coerce: "any"
      description: "Content safety level. `high` is the most restrictive; `off` applies no filtering. Omit it and Discovr's default filtering applies, not a fixed level."
      schema:
        type: string
        enum:
          - high
          - medium
          - low
          - off
      example: medium
    - name: country
      in: query
      required: false
      description: ISO 3166-1 alpha-2 country code for regional content preferences (e.g., `US`). Takes precedence over `locale`.
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
        example: "US"
      example: US
    - name: locale
      in: query
      required: false
      description: Only its region part is used (`en_US` is treated as `US`), and only when `country` is not sent.
      schema:
        type: string
        example: "en_US"
      example: en_US
  responses:
    "200":
      description: GIF results returned successfully.
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/GifSearchResponse"
          example:
            items:
              - id: "12345678"
                url: "https://static.klipy.com/example.gif"
                preview:
                  url: "https://static.klipy.com/preview.gif"
                  width: 200
                  height: 200
                description: "Happy Dance"
                tags:
                  - "happy"
                  - "dance"
                  - "celebration"
                width: 498
                height: 498
                createdAt: "2024-01-15T10:30:00.000Z"
            next: "1:20"
    "400":
      $ref: "../shared/responses.yaml#/BadRequest"
    "500":
      $ref: "../shared/responses.yaml#/InternalServerError"
    "429":
      $ref: "../shared/responses.yaml#/RateLimited"
    "503":
      $ref: "../shared/responses.yaml#/ServiceUnavailable"
