media:
  get:
    tags:
      - Discovr
      - Media
    summary: Get media details
    description: |
      Returns full details for a movie or TV show — title, overview, genres, release date, runtime, cast, crew, watch providers, and more. Pass `MV_<id>` for movies or `TV_<id>` for TV shows (e.g., `MV_550`, `TV_1396`).

      This is a public endpoint — no authentication required. Returns only generic catalog metadata; personalized fields live under `profile_meta`.
    operationId: getMedia
    x-tier: public
    x-cache-policy: session
    security: [] # Public endpoint - no authentication required
    parameters:
      - name: mediaId
        in: path
        required: true
        description: |
          The unique identifier of the media item. Use `MV_<id>` for movies or `TV_<id>` for TV shows (e.g., `MV_550`, `TV_1396`).

          Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
        schema:
          type: string
          pattern: '^(MV|TV)_\d+(@[0-9A-Za-z_-]+)?$'
    responses:
      "200":
        description: Full media details returned successfully.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/MediaResponse"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "404":
        $ref: "../shared/responses.yaml#/NotFound"
      "500":
        $ref: "../shared/responses.yaml#/InternalServerError"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "503":
        $ref: "../shared/responses.yaml#/ServiceUnavailable"

search:
  get:
    tags:
      - Discovr
      - Search
    summary: Search media
    description: |
      Searches across movies, TV shows, and people. Returns a ranked list of matches. Use the `query` (or `q`) parameter for the search term.

      Results are ordered by relevance — preserve that order rather than re-sorting client-side.

      This endpoint does not accept filters. To browse by genre, runtime, release window, or watch provider, create a page with `pageFilters` instead.
    operationId: searchMedia
    # Results can change over time, so cache by the hour rather than for the whole session.
    x-cache-policy: "ttl:3600"
    security:
      - BearerAuth: []
    parameters:
      - name: query
        in: query
        required: false
        description: |
          Search term. Use `query` or `q` — if both are provided, `query` takes precedence.
        schema:
          type: string
          example: "avatar"
      - name: q
        in: query
        required: false
        description: |
          Search term (shorthand for `query`). At least one of `query` or `q` is required.
        schema:
          type: string
          example: "avatar"
      - name: page
        in: query
        required: false
        description: |
          Page of results to return, starting at 1. Check `has_more` on the response to decide whether to request the next page.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          example: 1
    responses:
      "200":
        description: Search results returned successfully.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/SearchResponse"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "500":
        $ref: "../shared/responses.yaml#/InternalServerError"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "503":
        $ref: "../shared/responses.yaml#/ServiceUnavailable"

media/{mediaId}/similar:
  get:
    tags:
      - Discovr
      - Media
    summary: Get similar titles
    description: |
      Returns titles that are similar to the given movie or TV show. Useful for "More like this" sections.

      This is a public endpoint — no authentication required. Returns only generic catalog metadata.
    operationId: getSimilarRecommendations
    x-tier: public
    # Results can change over time, so cache by the hour rather than for the whole session.
    x-cache-policy: "ttl:3600"
    security: [] # Public endpoint - no authentication required
    parameters:
      - name: mediaId
        in: path
        required: true
        description: |
          The unique identifier of the media item. Use `MV_<id>` for movies or `TV_<id>` for TV shows (e.g., `MV_550`, `TV_1396`).

          Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
        schema:
          type: string
          pattern: '^(MV|TV)_\d+(@[0-9A-Za-z_-]+)?$'
      - name: language
        in: query
        required: false
        description: Language code for results (e.g., `en-US`).
        schema:
          type: string
          example: "en-US"
      - name: page
        in: query
        required: false
        description: "Page number for pagination (default: 1)."
        schema:
          type: integer
          minimum: 1
          default: 1
          example: 1
    responses:
      "200":
        description: Similar titles returned successfully.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/SimilarResponse"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "404":
        $ref: "../shared/responses.yaml#/NotFound"
      "500":
        $ref: "../shared/responses.yaml#/InternalServerError"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "503":
        $ref: "../shared/responses.yaml#/ServiceUnavailable"
