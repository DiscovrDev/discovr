    parameters:
      - name: mediaId
        in: path
        required: true
        description: |
          The title's media ID (`MV_<id>` or `TV_<id>`), or an item `ref`.
        schema:
          type: string
        example: "MV_550"
    responses:
      "200":
        description: Added to watchlist; returns the title's new state.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/TitleState"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "401":
        $ref: "../shared/responses.yaml#/Unauthorized"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "500":
