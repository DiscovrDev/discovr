        description: Removed from watchlist; returns the title's new state.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/TitleState"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "401":
        $ref: "../shared/responses.yaml#/Unauthorized"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "500":
        $ref: "../shared/responses.yaml#/InternalServerError"
      "503":
        $ref: "../shared/responses.yaml#/ServiceUnavailable"

watched:
  put:
    tags:
      - Discovr
      - Scrobble
    summary: Mark a title, season, or episode as watched
    description: |
      Marks a movie, an entire TV show, a season, or a single episode as watched in one atomic call.

      For TV shows, `season` and `episode` pick the scope:

      - Omit both to mark **every aired episode** across all regular seasons (season 1 and up) as watched. Specials (season `0`) are excluded.
      - Pass `season` to mark every aired episode of **that season**.
      - Pass `season` and `episode` to mark **that episode**.

      Any in-progress Continue Watching position within the marked scope is cleared automatically. Returns the title's updated `TitleState`, so you don't need to refetch `getTitleState`.

      **Auth tier:** session — send your session token in `Authorization: Bearer`.
    operationId: markWatched
    x-cache-policy: none
    security:
      - BearerAuth: []
    parameters:
      - name: mediaId
        in: path
        required: true
        description: |
          The title's media ID (`MV_<id>` or `TV_<id>`), or an item `ref`.
        schema:
          type: string
        example: "TV_1396"
      - name: season
        in: query
        required: false
        description: "TV only. Season number. Omit to mark every aired season of the show."
        schema:
          type: integer
          minimum: 1
        example: 1
      - name: episode
        in: query
        required: false
        description: "TV only, and only together with `season`. Episode number. Omit to mark the whole season."
        schema:
          type: integer
          minimum: 1
        example: 5
    responses:
      "200":
        description: Marked as watched; returns the title's new state.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/TitleState"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "401":
        $ref: "../shared/responses.yaml#/Unauthorized"
      "404":
        $ref: "../shared/responses.yaml#/NotFound"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "500":
        $ref: "../shared/responses.yaml#/InternalServerError"
      "503":
        $ref: "../shared/responses.yaml#/ServiceUnavailable"

  delete:
    tags:
      - Discovr
      - Scrobble
    summary: Mark a title, season, or episode as unwatched
    description: |
      Takes a movie, a TV show, a season, or an episode back to unwatched in one atomic call.

      It removes the watched state for that scope and clears any in-progress Continue Watching position inside it. Calling it for a title that isn't watched changes nothing and still succeeds, so it's safe to retry.

      For TV shows, `season` and `episode` choose how much to undo:

      - Omit both to undo **the whole show**, every season.
      - Pass `season` to undo **that season**.
      - Pass `season` and `episode` to undo **that episode**.

      Returns the title's updated `TitleState`, so you don't need to refetch `getTitleState`.

      **Auth tier:** session — send your session token in `Authorization: Bearer`.
    operationId: markUnwatched
    x-cache-policy: none
    security:
      - BearerAuth: []
    parameters:
      - name: mediaId
        in: path
        required: true
        description: |
          The title's media ID (`MV_<id>` or `TV_<id>`), or an item `ref`.
        schema:
          type: string
        example: "TV_1396"
      - name: season
        in: query
        required: false
        description: "TV only. Season number. Omit to undo every season of the show."
        schema:
          type: integer
          minimum: 1
        example: 1
      - name: episode
        in: query
        required: false
        description: "TV only, and only together with `season`. Episode number. Omit to undo the whole season."
        schema:
          type: integer
          minimum: 1
        example: 5
    responses:
      "200":
        description: Marked as unwatched; returns the title's new state.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/TitleState"
      "400":
        $ref: "../shared/responses.yaml#/BadRequest"
      "401":
        $ref: "../shared/responses.yaml#/Unauthorized"
      "429":
        $ref: "../shared/responses.yaml#/RateLimited"
      "500":
        $ref: "../shared/responses.yaml#/InternalServerError"
      "503":
        $ref: "../shared/responses.yaml#/ServiceUnavailable"
