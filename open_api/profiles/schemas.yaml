# Profile schemas for public API endpoints

AvatarMediaType:
  type: string
  description: |
    What kind of file `avatarUrl` points at, as a MIME type. Use it to choose between an image view and a video player, and to decide what can be animated, instead of guessing from the URL, since uploads have no file extension. `image/gif`, `video/mp4` and `video/webm` are animated; the others are still.

    On a profile it is absent when the type couldn't be determined; treat that as a still image. When you create or update a profile it is optional: Discovr works it out from the URL's file extension, so send it only when your URL has none. It can only be sent together with `avatarUrl`, and changing `avatarUrl` replaces it (or clears it when the new URL can't be typed), so it never describes the previous picture.
  enum:
    - image/png
    - image/jpeg
    - image/webp
    - image/gif
    - video/mp4
    - video/webm
  example: "image/png"

CreateProfilePayload:
  type: object
  description: Name and avatar for the new profile.
  required:
    - name
    - avatarUrl
  properties:
    name:
      type: string
      description: The display name for the profile.
      example: "Sci-Fi Lover"
    avatarUrl:
      type: string
      description: URL of the profile avatar image.
      format: uri
      example: "https://example.com/avatar.jpg"
    avatarMediaType:
      $ref: "#/AvatarMediaType"
  additionalProperties: false

CreateProfileResponse:
  type: object
  description: Contains the ID of the newly created profile. Use it with `POST /auth/session-token` to start browsing.
  required:
    - profileId
  properties:
    profileId:
      type: string
      description: The ID of the newly created profile.
      example: "profile_abc123xyz"
  additionalProperties: false

Profile:
  type: object
  description: A Discovr profile with its display info and creation timestamp.
  required:
    - id
    - name
    - avatarUrl
    - createdAt
  properties:
    id:
      type: string
      description: The unique ID of the profile.
      example: "profile_abc123xyz"
    name:
      type: string
      description: The profile's display name.
      example: "Sci-Fi Lover"
    avatarUrl:
      type: string
      description: URL of the profile's avatar image.
      format: uri
      example: "https://example.com/avatar.jpg"
    avatarMediaType:
      $ref: "#/AvatarMediaType"
    createdAt:
      type: string
      format: date-time
      description: When the profile was created, as an ISO 8601 timestamp.
      example: "2023-01-01T00:00:00.000Z"
  additionalProperties: false

UpdateProfilePayload:
  type: object
  description: Fields to update on the profile. All fields are optional — provide only what's changing. At least one must be present.
  properties:
    name:
      type: string
      description: New display name for the profile.
      example: "Action Movie Fan"
    avatarUrl:
      type: string
      description: New avatar URL for the profile.
      format: uri
      example: "https://example.com/new-avatar.jpg"
    avatarMediaType:
      $ref: "#/AvatarMediaType"
  additionalProperties: false

DeleteProfileResponse:
  type: object
  description: Confirmation that the profile was deleted.
  required:
    - message
  properties:
    message:
      type: string
      description: A confirmation message.
      example: "Profile deleted successfully"
  additionalProperties: false

GetProfilesResponse:
  type: object
  description: List of profiles for the signed-in user.
  required:
    - profiles
  properties:
    profiles:
      type: array
      description: Profiles for the signed-in user, ordered by creation date (newest first).
      items:
        $ref: "#/Profile"
      example:
        - id: "profile_abc123xyz"
          name: "Sci-Fi Lover"
          avatarUrl: "https://example.com/avatar.jpg"
          createdAt: "2023-01-01T00:00:00.000Z"
        - id: "profile_def456uvw"
          name: "Action Movie Fan"
          avatarUrl: "https://example.com/avatar2.jpg"
          createdAt: "2023-01-02T00:00:00.000Z"
  additionalProperties: false

# Title State & Rating Schemas
Rating:
  type: string
  description: One of the three mutually exclusive ratings a profile can give a title.
  enum:
    - liked
    - disliked
    - super_liked
  example: "liked"

SetRatingPayload:
  type: object
  description: The rating to set on a title.
  required:
    - value
  properties:
    value:
      $ref: "#/Rating"
  additionalProperties: false

TitlePlayback:
  type: object
  description: The active profile's live resume position for an in-progress title.
  required:
    - updatedAt
  properties:
    progress:
      type: number
      minimum: 0
      maximum: 100
      description: How far through the movie or episode the viewer is, as a percentage (0–100).
      example: 45.5
    season:
      type: integer
      minimum: 1
      description: Season number of the episode currently being watched (TV shows only).
      example: 2
    episode:
      type: integer
      minimum: 1
      description: Episode number currently being watched (TV shows only).
      example: 5
    updatedAt:
      type: string
      format: date-time
      description: When this position was last recorded.
      example: "2026-01-15T20:00:00.000Z"
  additionalProperties: false

TitleState:
  type: object
  description: The active profile's complete state for a title — returned by `getTitleState` and by every title state write.
  required:
    - mediaId
    - mediaType
    - watchlist
    - watched
    - completed
    - plays
  properties:
    mediaId:
      type: string
      description: The title's media ID (`MV_<id>` or `TV_<id>`).
      example: "TV_1396"
    mediaType:
      type: string
      enum: [movie, tv]
      description: Whether this title is a movie or a TV show.
      example: "tv"
    rating:
      anyOf:
        - $ref: "#/Rating"
        - type: "null"
      description: The profile's rating (`liked`, `disliked`, `super_liked`), or `null` if unrated.
    watchlist:
      type: boolean
      description: Whether the title is on the profile's watchlist.
      example: true
    watched:
      type: boolean
      description: Whether the profile has played any of this title, even briefly. Use `completed` for a "Watched" checkmark.
      example: true
    completed:
      type: boolean
      description: Whether the profile has finished the title (≥ 80% for a movie; every aired episode of every regular season for a TV show; specials excluded).
      example: false
    completedSeasons:
      type: array
      description: TV shows only — regular season numbers (1 and up) whose aired episodes are all watched.
      items:
        type: integer
      example: [1, 2]
    episodes:
      type: object
      description: TV shows only — map from season number (as string) to sorted watched episode numbers.
      additionalProperties:
        type: array
        items:
          type: integer
      example:
        "1": [1, 2, 3, 4, 5, 6, 7]
    plays:
      type: integer
      minimum: 0
      description: Number of completed plays (of the movie or of episodes).
      example: 7
    playback:
      anyOf:
        - $ref: "#/TitlePlayback"
        - type: "null"
      description: Live resume position if the viewer is currently mid-watch, or `null` otherwise.
    providers:
      type: array
      description: Streaming services where this title is available, filtered to the account's selected providers. Present only when `providers=true` is passed to `getTitleState`.
      items:
        $ref: "../media/schemas.yaml#/ProviderInfo"
  additionalProperties: false

SeasonEpisodeState:
  type: object
  description: Whether the active profile has finished one episode of a season.
  required:
    - episode
    - completed
  properties:
    episode:
      type: integer
      minimum: 1
      description: Episode number within the season.
      example: 1
    completed:
      type: boolean
      description: Whether the profile has finished this episode.
      example: true
  additionalProperties: false

SeasonState:
  type: object
  description: Per-episode completion state for one TV season, plus whether the season as a whole is complete.
  required:
    - season
    - completed
    - episodes
  properties:
    season:
      type: integer
      minimum: 0
      description: The season number.
      example: 1
    completed:
      type: boolean
      description: Whether every aired episode of this season is watched.
      example: false
    episodes:
      type: array
      description: Completion state for every episode in the season.
      items:
        $ref: "#/SeasonEpisodeState"
  additionalProperties: false

# Scrobble Schemas
EpisodeRef:
  type: object
  description: Episode context for TV show scrobbles.
  required:
    - season
    - episode
  properties:
    season:
      type: integer
      minimum: 1
      description: Season number.
      example: 2
    episode:
      type: integer
      minimum: 1
      description: Episode number.
      example: 5
  additionalProperties: false

ScrobbleProgressBody:
  type: object
  description: Body form of a progress report, for the route that already carries the title in its path.
  required:
    - progress
  properties:
    progress:
      type: number
      minimum: 0
      maximum: 100
      description: Current playback position as a percentage (0–100).
      example: 42.5
    tv:
      description: Which episode is playing. Required for TV shows, omitted for movies.
      $ref: "#/EpisodeRef"
  additionalProperties: false

ScrobbleResponse:
  type: object
  description: Confirms a progress report, echoing what was recorded and whether it counted as watched.
  required:
    - status
    - progress
    - completed
  properties:
    status:
      type: string
      description: Always `"ok"` on success.
      example: "ok"
    progress:
      type: number
      description: The progress value recorded (0–100).
      minimum: 0
      maximum: 100
      example: 85.0
    completed:
      type: boolean
      description: "`true` if the movie or episode reached 80% or more."
      example: true
    completedSeasons:
      type: array
      description: Present when a TV episode crosses 80% — lists every regular season now fully watched.
      items:
        type: integer
      example: [1]
  additionalProperties: false
