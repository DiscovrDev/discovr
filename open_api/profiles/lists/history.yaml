# Path operations for watch-history imports

post:
  tags:
    - Discovr
    - Profile Lists
  x-sdk-group: History
  summary: Import a watch history entry
  description: |
    Imports a previously watched movie, show, season, or episode from an external source.

    - `mediaId`: the title to import (`MV_<number>` for movies, `TV_<number>` for TV shows).
    - `imported`: required string naming the external source (for example `"trakt"`).
    - `updatedAt`: optional ISO 8601 timestamp of when it was watched. Defaults to now.
    - `season` / `episode`: optional TV scope. Omit both to import all aired episodes of the show; pass `season` to import that season; pass both to import a single episode.

    For live viewing use `scrobble()`, and for interactive "Mark as watched" buttons use `markWatched()`. To read watch history, use `GET /profile/titles?watched=true`.

    Returns the title's updated `TitleState`.

    **Auth tier:** session — send your session token in `Authorization: Bearer`.
  operationId: importHistory
  x-cache-policy: none
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas.yaml#/ImportHistoryPayload"
        example:
          mediaId: "TV_1396"
          imported: "trakt"
          updatedAt: "2023-01-15T20:00:00.000Z"
          season: 1
          episode: 5
  responses:
    "201":
      description: History imported; returns the title's new state.
      content:
        application/json:
          schema:
            $ref: "../schemas.yaml#/TitleState"
    "400":
      $ref: "../../shared/responses.yaml#/BadRequest"
    "401":
      $ref: "../../shared/responses.yaml#/Unauthorized"
    "404":
      $ref: "../../shared/responses.yaml#/NotFound"
    "429":
      $ref: "../../shared/responses.yaml#/RateLimited"
    "500":
      $ref: "../../shared/responses.yaml#/InternalServerError"
    "503":
      $ref: "../../shared/responses.yaml#/ServiceUnavailable"
