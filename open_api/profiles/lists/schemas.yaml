# Shared schemas for Profile Lists

# Title List Item (returned by GET /profile/titles)
TitleListItem:
  description: A title from a profile's rating, watchlist, or watch-history list, with display artwork and state summary.
  type: object
  required:
    - id
    - mediaType
    - title
    - poster_path
    - backdrop_path
    - watchlist
    - updatedAt
  properties:
    id:
      type: string
      description: The DiscovrID (`TV_<number>` or `MV_<number>`).
      example: "MV_550"
    ref:
      type: string
      description: |
        This item's `id` with the list it came from attached.

        Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, rating it, or removing it from a list. A bare `id` always works; `ref` is never required.
      example: "MV_550@Pc1tD7vKj3NxU6eO"
    mediaType:
      type: string
      enum: [movie, tv]
      description: The type of media.
      example: "movie"
    title:
      type: string
      description: The title of the media.
      example: "Fight Club"
    poster_path:
      type: [object, "null"]
      description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
      additionalProperties:
        type: string
        format: uri
      example:
        w185: "https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        w500: "https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        original: "https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
    backdrop_path:
      type: [object, "null"]
      description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
      additionalProperties:
        type: string
        format: uri
      example:
        w185: "https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        w500: "https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        original: "https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
    rating:
      anyOf:
        - $ref: "../schemas.yaml#/Rating"
        - type: "null"
      description: The profile's rating for this title, or `null` if unrated.
    watchlist:
      type: boolean
      description: Whether this title is on the profile's watchlist.
      example: false
    updatedAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp for the active sort dimension (rated time, watchlisted time, or last watched time).
      example: "2026-01-15T20:00:00.000Z"
    completed:
      type: boolean
      description: Present on `watched=true` results — whether the title is fully finished.
      example: true
    plays:
      type: integer
      minimum: 0
      description: Present on `watched=true` results — total completed plays.
      example: 1
    season:
      type: integer
      minimum: 1
      description: Present on `watched=true` TV results — most recently watched season number.
      example: 2
    episode:
      type: integer
      minimum: 1
      description: Present on `watched=true` TV results — most recently watched episode number.
      example: 5
    imported:
      type: string
      description: Present on `watched=true` results when imported from an external source (e.g., `"trakt"`).
      example: "trakt"
  additionalProperties: false

# Title List Response
TitleListResponse:
  description: "Paginated list of titles. Pass `nextPageToken` to fetch the next page."
  type: object
  required:
    - items
    - hasMore
  properties:
    items:
      type: array
      description: Array of title list items.
      items:
        $ref: "#/TitleListItem"
    hasMore:
      type: boolean
      description: Whether more items are available.
      example: true
    nextPageToken:
      type: string
      description: Opaque token to fetch the next page of results.
  additionalProperties: false

# Playback List Item (Continue Watching)
PlaybackItem:
  description: "A media item with live playback progress. `progress` is 0–100."
  type: object
  required:
    - id
    - mediaType
    - title
    - poster_path
    - backdrop_path
    - createdAt
  properties:
    id:
      type: string
      description: The DiscovrID (`TV_<number>` or `MV_<number>`).
      example: "MV_550"
    ref:
      type: string
      description: |
        This item's `id` with the list it came from attached.

        Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, scrobbling it, or removing it from Continue Watching. A bare `id` always works; `ref` is never required.
      example: "MV_550@Zi9bF4wSm0QaT2hC"
    mediaType:
      type: string
      enum: [movie, tv]
      description: The type of media.
      example: "movie"
    title:
      type: string
      description: The title of the media.
      example: "Fight Club"
    poster_path:
      type: [object, "null"]
      description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
      additionalProperties:
        type: string
        format: uri
      example:
        w185: "https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        w500: "https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        original: "https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
    backdrop_path:
      type: [object, "null"]
      description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
      additionalProperties:
        type: string
        format: uri
      example:
        w185: "https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        w500: "https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        original: "https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
    episode_image:
      type: [object, "null"]
      description: Episode still image URLs keyed by width bucket. Only present for episode-level playback items.
      additionalProperties:
        type: string
        format: uri
      example:
        w185: "https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        w500: "https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
        original: "https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"
    episode_title:
      type: [string, "null"]
      description: The title of the episode (only present for episode-level playback items).
      example: "Winter Is Coming"
    progress:
      type: number
      minimum: 0
      maximum: 100
      description: Playback progress percentage (0–100).
      example: 45.5
    updatedAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp indicating when playback was last updated.
      example: "2023-01-15T00:00:00.000Z"
    season:
      type: integer
      minimum: 1
      description: Season number (only for TV shows).
      example: 2
    episode:
      type: integer
      minimum: 1
      description: Episode number (only for TV shows).
      example: 5
    createdAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp indicating when the item was first added to Continue Watching.
      example: "2023-01-01T00:00:00.000Z"
  additionalProperties: false

# Playback List Response
PlaybackListResponse:
  description: Paginated list of items with live playback progress.
  type: object
  required:
    - items
    - hasMore
  properties:
    items:
      type: array
      description: Array of playback items.
      items:
        $ref: "#/PlaybackItem"
    hasMore:
      type: boolean
      description: Whether there are more items available.
      example: true
    nextPageToken:
      type: string
      description: Opaque token to fetch the next page of results.
  additionalProperties: false

# Import History Request
ImportHistoryPayload:
  description: A watch history entry to import from an external source.
  type: object
  required:
    - mediaId
    - imported
  properties:
    mediaId:
      type: string
      description: Full media ID (`MV_<number>` or `TV_<number>`), or an item `ref`.
      example: "TV_1396"
    imported:
      type: string
      minLength: 1
      description: Name of the external source being imported from (for example `"trakt"`).
      example: "trakt"
    updatedAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp of when the title was watched. Defaults to now if omitted.
      example: "2023-01-15T20:00:00.000Z"
    season:
      type: integer
      minimum: 1
      description: TV only. Season number to import. Omit to import every aired episode of the show.
      example: 1
    episode:
      type: integer
      minimum: 1
      description: TV only, and only together with `season`. Episode number to import. Omit to import every aired episode of the season.
      example: 5
  additionalProperties: false

# Success Message Response
SuccessMessage:
  description: Confirmation response for deletions that do not return a title state object.
  type: object
  required:
    - message
  properties:
    message:
      type: string
      description: Success message.
      example: "Playback deleted successfully"
  additionalProperties: false
