# Path operations for watchlist endpoints

get:
  tags:
    - Discovr
    - Profile Lists
  x-sdk-group: Watchlist
  summary: Get watchlist items
  description: |
    Returns the profile's watchlist — titles saved to watch later.

    **Auth tier:** session — send the session token from `POST /auth/session-token`.

    Ordered by when they were added (newest first). Supports cursor-based pagination via `nextPageToken`.

    **Pagination:**
    - Pass `nextPageToken` from a previous response to fetch the next page.
    - If `hasMore` is `true`, there are more items available.
  operationId: getWatchlistItems
  # Never cache: reflects live, cross-device mutable profile state.
  x-cache-policy: none
  security:
    - BearerAuth: []
  parameters:
    - name: nextPageToken
      in: query
      required: false
      description: "Opaque token from previous page for pagination"
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: "Maximum number of items to return (1-50, default: 10)"
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  responses:
    "200":
      description: List of watchlist items retrieved successfully
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/SimpleListResponse"
    "400":
      $ref: "../../shared/responses.yaml#/BadRequest"
    "401":
      $ref: "../../shared/responses.yaml#/Unauthorized"
    "404":
      $ref: "../../shared/responses.yaml#/NotFound"
    "500":
      $ref: "../../shared/responses.yaml#/InternalServerError"
    "429":
      $ref: "../../shared/responses.yaml#/RateLimited"
    "503":
      $ref: "../../shared/responses.yaml#/ServiceUnavailable"

post:
  tags:
    - Discovr
    - Profile Lists
  x-sdk-group: Watchlist
  summary: Add an item to watchlist
  description: |
    Adds a title to the watchlist.

    **Auth tier:** session — send the session token from `POST /auth/session-token`.

    Unlike liked/disliked/super-liked, the watchlist is non-exclusive — you can watchlist something regardless of how it's rated. Titles are automatically removed from the watchlist when the user starts watching via `scrobble`.
  operationId: addWatchlistItem
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas.yaml#/AddSimpleListItemPayload"
        example:
          mediaId: "MV_550"
  responses:
    "201":
      description: Item added to watchlist.
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/SuccessMessage"
          example:
            message: "Watchlist item added successfully"
    "400":
      $ref: "../../shared/responses.yaml#/BadRequest"
    "401":
      $ref: "../../shared/responses.yaml#/Unauthorized"
    "404":
      $ref: "../../shared/responses.yaml#/NotFound"
    "500":
      $ref: "../../shared/responses.yaml#/InternalServerError"
    "429":
      $ref: "../../shared/responses.yaml#/RateLimited"
    "503":
      $ref: "../../shared/responses.yaml#/ServiceUnavailable"

delete:
  tags:
    - Discovr
    - Profile Lists
  x-sdk-group: Watchlist
  summary: Delete an item from watchlist
  description: |
    Removes a title from the watchlist. Pass the full media ID (e.g., `MV_550` for a movie, `TV_1396` for a TV show).
  operationId: deleteWatchlistItem
  security:
    - BearerAuth: []
  parameters:
    - name: mediaId
      in: path
      required: true
      description: |
        Full media ID — `MV_<number>` for movies, `TV_<number>` for TV shows (e.g., `MV_550`).

        Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
      schema:
        type: string
      example: "MV_550"
  responses:
    "200":
      description: Item deleted successfully
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/SuccessMessage"
          example:
            message: "Watchlist item deleted successfully"
    "400":
      $ref: "../../shared/responses.yaml#/BadRequest"
    "401":
      $ref: "../../shared/responses.yaml#/Unauthorized"
    "404":
      $ref: "../../shared/responses.yaml#/NotFound"
    "500":
      $ref: "../../shared/responses.yaml#/InternalServerError"
    "429":
      $ref: "../../shared/responses.yaml#/RateLimited"
    "503":
      $ref: "../../shared/responses.yaml#/ServiceUnavailable"
