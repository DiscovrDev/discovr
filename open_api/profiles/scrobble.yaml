post:
  tags:
    - Discovr
    - Scrobble
  summary: Record playback progress
  description: |
    Scrobbling is Discovr's single-call way to track playback. One call updates live resume progress, watch history, completion, and the watchlist.

    Send the viewer's real position when playback starts (not `0` when resuming), about every 30 seconds while watching, and right away on pause, resume, seek, and completion. Discovr handles the rest:

    - The title stays in Continue Watching until the movie or episode crosses 80%.
    - Once progress reaches 20% or more, the title is automatically removed from the watchlist — for both movies and TV shows.
    - Once progress reaches 80% or more, the movie or episode is marked watched and leaves Continue Watching. Lower progress later (such as a rewind) moves the live position without undoing completion — use `markUnwatched` to undo a watch.
    - For TV shows, include `season` and `episode` in `tv`. When an episode crosses 80%, the response includes `completedSeasons` listing every season now fully watched.

    **Auth tier:** session — send your session token in `Authorization: Bearer`.
  operationId: scrobble
  security:
    - BearerAuth: []
  parameters:
    - name: mediaId
      in: path
      required: true
      description: |
        The media ID in `MV_<number>` or `TV_<number>` format (e.g., `MV_550`, `TV_1396`).

        Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
      schema:
        type: string
        pattern: '^(MV|TV)_\d+(@[0-9A-Za-z_-]+)?$'
      example: "TV_1396"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas.yaml#/ScrobbleProgressBody"
        example:
          progress: 15.5
          tv:
            season: 1
            episode: 2
  responses:
    "200":
      description: Progress recorded. Check `completed` to know if the movie or episode reached 80%.
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/ScrobbleResponse"
          example:
            status: "ok"
            progress: 15.5
            completed: false
    "400":
      $ref: "../shared/responses.yaml#/BadRequest"
    "401":
      $ref: "../shared/responses.yaml#/Unauthorized"
    "404":
      $ref: "../shared/responses.yaml#/NotFound"
    "500":
      $ref: "../shared/responses.yaml#/InternalServerError"
    "429":
      $ref: "../shared/responses.yaml#/RateLimited"
    "503":
      $ref: "../shared/responses.yaml#/ServiceUnavailable"
