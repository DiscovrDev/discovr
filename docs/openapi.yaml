          type: boolean
          description: Whether the title is on the profile's watchlist.
        liked:
          type: boolean
          description: Whether the profile has liked the title.
        disliked:
          type: boolean
          description: Whether the profile has disliked the title.
        super_liked:
          type: boolean
          description: Whether the profile has super-liked the title.
        playback:
          title: MediaProfileMetaPlayback
          type: object
          description: Where the profile is up to in this title. Drives a progress bar and a Resume button.
          required:
            - inlist
          properties:
            inlist:
              type: boolean
