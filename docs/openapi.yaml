components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Which token you send depends on the tier:

        - **Identity tier** (`/profiles`, `/auth/session-token`, `/auth/session`)
          — your refresh token (`rt_<hex>`), valid for 90 days.
        - **Session tier** (`/pages/*`, `/profile/*`) — the session token
          returned by `POST /auth/session-token`, valid for 30 minutes.

        Format: `Authorization: Bearer {token}`

        Using an SDK? You never set this header yourself. Sign in, select a
        profile, and the SDK sends the right token on every call and renews it
        before it runs out.

        **Just want to try these endpoints?** Grab a temporary demo token from
        Developer Options in your [dashboard](https://discovr.media/dashboard)
        and paste it here — no sign-up needed. The dialog gives you both tokens
        above; use the refresh token for identity-tier endpoints and the session
        token for session-tier ones.

        Step-by-step, including which endpoints want a `clientId` instead:
        [How to get playground credentials](https://docs.discovr.media/guides/getting-started/try-it-in-the-docs).
  schemas:
    DeviceCodePayload:
      type: object
      description: Request body for starting the device code flow.
      required:
        - clientID
      properties:
        clientID:
          type: string
          description: Your registered app ID.
          example: abc123xyz
        demo:
          type: boolean
          description: |
            Set when the requesting SDK is configured with demo mode, so the sign-in
            screen offers "Continue as Demo" as an alternative to a real sign-in.
            Defaults to false.
          default: false
      additionalProperties: false
    DeviceCodeResponse:
      type: object
      description: |
        Contains the codes needed for device authentication. Display `userCode` on screen and use `authQRCode` as an image source.
        Returned when `format=json` (the default). With `format=image`, the response is a binary PNG instead.
      required:
        - deviceCode
        - userCode
        - authQRCode
        - verificationUrl
        - expiresIn
        - interval
      properties:
        deviceCode:
          type: string
          description: |
            The code that identifies this authorization request. Pass it to the poll endpoint.
            It is the secret you poll with, so keep it on the device: it is never shown to the person, never put in the QR code, and never needed by the phone.
          example: dvc_abc123xyz789
        userCode:
          type: string
          description: |
            A short numeric code for the user to type if they can't scan the QR code. Show it on screen.
            The QR code carries this code and nothing else.
          pattern: ^[0-9]{4}$
          example: "1234"
        authQRCode:
          type: string
          description: |
            A ready-to-display QR code image as a base64 data URL. Set it as the `src` of an `<img>` tag — no extra processing needed.
          format: uri
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        verificationUrl:
          type: string
          format: uri
          description: |
            The page where someone types `userCode` when they can't scan the QR code. Show it on screen next to the code.
          example: https://discovr.media/tv-auth
        expiresIn:
          type: integer
          description: How long the device code is valid, in milliseconds.
          example: 600000
        interval:
          type: integer
          minimum: 1
          description: |
            How many seconds to wait between polls. The SDKs follow it for you. Every pending
            poll repeats it and may raise it, so a device that has been waiting a while polls less often.
          example: 5
      additionalProperties: false
    DeviceCodePendingResponse:
      type: object
      description: Returned while polling and the user hasn't confirmed the device code yet. Keep polling.
      required:
        - status
        - interval
      properties:
        status:
          type: string
          enum:
            - pending
          description: Always `pending`. Its presence is the signal to wait and poll again.
        interval:
          type: integer
          minimum: 1
          description: Seconds to wait before the next poll. It can grow the longer the code has been waiting, so always use the latest value.
          example: 10
      additionalProperties: false
    DeviceCodePollResponse:
      description: |
        The answer to a device-code poll. Two shapes: a `RefreshTokenResponse` once the person has approved, or a
        `DeviceCodePendingResponse` while they haven't. Tell them apart by the `status` field, which only the pending one has.
      oneOf:
        - $ref: "#/components/schemas/RefreshTokenResponse"
        - $ref: "#/components/schemas/DeviceCodePendingResponse"
    DevicePollPayload:
      type: object
      description: Optional body of a device-code poll.
      properties:
        deviceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: |
            A random, stable identifier for the device signing in: 128 bits, lowercase hex. The SDKs generate it once,
            keep it across sign-outs and send it for you.

            Signing in again from the same device with the same `deviceId` replaces the credential that device already
            held, which stops working, rather than adding a second one beside it. Leave it out and every sign-in is a
            credential of its own. A value that is not 32 lowercase hex characters is rejected with `invalid-input`.

            Never copy it to another device: two devices sharing one `deviceId` sign each other out.
          example: 7f3a91c2d4e85b60a1c97e24f8d03b5a
      additionalProperties: false
    RefreshTokenResponse:
      type: object
      description: |
        Returned when a sign-in completes: the device code was confirmed, or a web sign-in's authorization code was redeemed.
        Store the `refreshToken` securely — it's your long-lived credential.
        Call `POST /auth/session-token` with a `profileId` to get a session token and start browsing.
      required:
        - refreshToken
        - publicId
        - expiresAt
      properties:
        refreshToken:
          type: string
          description: |
            Your long-lived credential (valid for 90 days). Use it as the bearer for identity-tier endpoints and to mint session tokens.
            Keep it secure — treat it like a password and never put it in URLs.
          example: rt_a1b2c3d4e5f6...
        publicId:
          type: string
          description: An identifier for this device's sign-in. There's no way to target it directly — call `DELETE /auth/session` from this device to sign it out.
          example: MqXYz12abc
        expiresAt:
          type: integer
          format: int64
          description: When the refresh token expires, as a Unix timestamp (seconds).
          example: 1733088000
      additionalProperties: false
    MintSessionTokenPayload:
      type: object
      description: The profile to scope the session to.
      required:
        - profileId
      properties:
        profileId:
          type: string
          description: The ID of the profile to activate. Must belong to the signed-in user.
          example: profile_abc123
        ttlMs:
          type: integer
          description: |
            Override the session token's lifetime, in milliseconds. Can only shorten it below the default (30 minutes) — never lengthen it. Whether or not you send this, a session token never outlives the refresh token that minted it, so a demo sandbox's session token ends with the sandbox.
          example: 120000
        snapshotId:
          type: string
          description: |
            The `snapshotId` from your previous session token. Pass it to keep the user's recommendations where they were — renewing a session token is routine, and shouldn't reshuffle the screen underneath them.

            Omit it on a first sign-in, or when switching profiles — there's nothing to carry over in either case. Recommendations refresh on their own roughly every 30 minutes.
          example: Wm4rT9xKq2Lv7BnD
      additionalProperties: false
    SessionTokenResponse:
      type: object
      description: The session token scoped to the selected profile. Valid for 30 minutes.
      required:
        - sessionToken
        - snapshotId
        - expiresAt
      properties:
        sessionToken:
          type: string
          description: |
            Your session credential, valid for 30 minutes. Send it as the bearer in the `Authorization` header for all session-tier endpoints (`/pages/*`, `/profile/*`).
          example: sess_4f9c1a7e2b...
        snapshotId:
          type: string
          description: |
            Identifies the set of recommendations the user is currently browsing. Keep it and send it back on your next call to this endpoint, so renewing their credential doesn't reshuffle what they're looking at.

            Recommendations refresh roughly every 30 minutes; when they do, this value changes and pages come back re-ranked. Page IDs are unaffected.
          example: Wm4rT9xKq2Lv7BnD
        expiresAt:
          type: integer
          format: int64
          description: When the session token expires, as a Unix timestamp (seconds).
          example: 1733091000
      additionalProperties: false
    SignOutResponse:
      type: object
      description: Confirms the refresh token you sent has been revoked.
      required:
        - revoked
      properties:
        revoked:
          type: boolean
          description: Always `true` on success — the refresh token you sent is no longer usable.
          example: true
      additionalProperties: false
    DemoSessionRequest:
      type: object
      description: Starts a demo sandbox — a throwaway account, pre-populated, that needs no sign-up.
      required:
        - clientId
      properties:
        clientId:
          type: string
          description: |
            Your registered client id — the same one your SDK constructor already takes regardless of demo mode. Use `discovr-docs-playground` if you're trying this endpoint directly rather than through an app of your own.
          example: discovr-docs-playground
        ttlMs:
          type: integer
          description: |
            Override the sandbox's lifetime, in milliseconds. Can only shorten it below the default (30 minutes) — never lengthen it. Useful for testing how your app handles an expired session without waiting out the real interval.
          example: 120000
      additionalProperties: false
    DemoSessionResponse:
      type: object
      description: A refresh token for a freshly created demo sandbox.
      required:
        - refreshToken
        - expiresAt
      properties:
        refreshToken:
          type: string
          description: |
            A refresh token for the sandbox, exactly like the one you'd get from a real sign-in — use it the same way. It's short-lived, and when it expires the sandbox goes with it.
          example: rt_9f8c2a1b4d6e...
        expiresAt:
          type: integer
          format: int64
          description: When the sandbox and its token expire, as a Unix timestamp (seconds).
          example: 1733091000
      additionalProperties: false
    WebTokenPayload:
      type: object
      description: Redeems the authorization code a web sign-in delivered to your app.
      required:
        - clientID
        - code
        - codeVerifier
      properties:
        clientID:
          type: string
          description: Your client ID — the one the sign-in was started with.
          example: abc123xyz
        code:
          type: string
          description: |
            The single-use authorization code Discovr delivered to your app (a `postMessage` to the sign-in
            window's opener, or the `code` query parameter on your redirect URL). It expires after 60 seconds and is
            useless without `codeVerifier`.
          example: Gh2kd9QpXw3LmN7vRtYa.k3J9xQmPz1VbT6uYhN4oWcE8sA2dF5gLrXiUqZjKvBeM
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          description: |
            The random secret you generated when you started the sign-in, whose SHA-256 you sent as `codeChallenge`.
            It never leaves your app until this call. A wrong verifier burns the code.
          example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
        deviceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: |
            A random, stable identifier for the device signing in: 128 bits, lowercase hex. The SDKs generate it once,
            keep it across sign-outs and send it for you.

            Signing in again from the same device with the same `deviceId` replaces the credential that device already
            held, which stops working, rather than adding a second one beside it. Leave it out and every sign-in is a
            credential of its own. A value that is not 32 lowercase hex characters is rejected with `invalid-input`,
            before the code is spent.

            Never copy it to another device: two devices sharing one `deviceId` sign each other out.
          example: 7f3a91c2d4e85b60a1c97e24f8d03b5a
      additionalProperties: false
    AvatarMediaType:
      type: string
      description: |
        What kind of file `avatarUrl` points at, as a MIME type. Use it to choose between an image view and a video player, and to decide what can be animated, instead of guessing from the URL, since uploads have no file extension. `image/gif`, `video/mp4` and `video/webm` are animated; the others are still.

        On a profile it is absent when the type couldn't be determined; treat that as a still image. When you create or update a profile it is optional: Discovr works it out from the URL's file extension, so send it only when your URL has none. It can only be sent together with `avatarUrl`, and changing `avatarUrl` replaces it (or clears it when the new URL can't be typed), so it never describes the previous picture.
      enum:
        - image/png
        - image/jpeg
        - image/webp
        - image/gif
        - video/mp4
        - video/webm
      example: image/png
    CreateProfilePayload:
      type: object
      description: Name and avatar for the new profile.
      required:
        - name
        - avatarUrl
      properties:
        name:
          type: string
          description: The display name for the profile.
          example: Sci-Fi Lover
        avatarUrl:
          type: string
          description: URL of the profile avatar image.
          format: uri
          example: https://example.com/avatar.jpg
        avatarMediaType:
          $ref: "#/components/schemas/AvatarMediaType"
      additionalProperties: false
    CreateProfileResponse:
      type: object
      description: Contains the ID of the newly created profile. Use it with `POST /auth/session-token` to start browsing.
      required:
        - profileId
      properties:
        profileId:
          type: string
          description: The ID of the newly created profile.
          example: profile_abc123xyz
      additionalProperties: false
    Profile:
      type: object
      description: A Discovr profile with its display info and creation timestamp.
      required:
        - id
        - name
        - avatarUrl
        - createdAt
      properties:
        id:
          type: string
          description: The unique ID of the profile.
          example: profile_abc123xyz
        name:
          type: string
          description: The profile's display name.
          example: Sci-Fi Lover
        avatarUrl:
          type: string
          description: URL of the profile's avatar image.
          format: uri
          example: https://example.com/avatar.jpg
        avatarMediaType:
          $ref: "#/components/schemas/AvatarMediaType"
        createdAt:
          type: string
          format: date-time
          description: When the profile was created, as an ISO 8601 timestamp.
          example: "2023-01-01T00:00:00.000Z"
      additionalProperties: false
    GetProfilesResponse:
      type: object
      description: List of profiles for the signed-in user.
      required:
        - profiles
      properties:
        profiles:
          type: array
          description: Profiles for the signed-in user, ordered by creation date (newest first).
          items:
            $ref: "#/components/schemas/Profile"
          example:
            - id: profile_abc123xyz
              name: Sci-Fi Lover
              avatarUrl: https://example.com/avatar.jpg
              createdAt: "2023-01-01T00:00:00.000Z"
            - id: profile_def456uvw
              name: Action Movie Fan
              avatarUrl: https://example.com/avatar2.jpg
              createdAt: "2023-01-02T00:00:00.000Z"
      additionalProperties: false
    UpdateProfilePayload:
      type: object
      description: Fields to update on the profile. All fields are optional — provide only what's changing. At least one must be present.
      properties:
        name:
          type: string
          description: New display name for the profile.
          example: Action Movie Fan
        avatarUrl:
          type: string
          description: New avatar URL for the profile.
          format: uri
          example: https://example.com/new-avatar.jpg
        avatarMediaType:
          $ref: "#/components/schemas/AvatarMediaType"
      additionalProperties: false
    DeleteProfileResponse:
      type: object
      description: Confirmation that the profile was deleted.
      required:
        - message
      properties:
        message:
          type: string
          description: A confirmation message.
          example: Profile deleted successfully
      additionalProperties: false
    Rating:
      type: string
      description: One of the three mutually exclusive ratings a profile can give a title.
      enum:
        - liked
        - disliked
        - super_liked
      example: liked
    SetRatingPayload:
      type: object
      description: The rating to set on a title.
      required:
        - value
      properties:
        value:
          $ref: "#/components/schemas/Rating"
      additionalProperties: false
    TitlePlayback:
      type: object
      description: The active profile's live resume position for an in-progress title.
      required:
        - updatedAt
      properties:
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: How far through the movie or episode the viewer is, as a percentage (0–100).
          example: 45.5
        season:
          type: integer
          minimum: 1
          description: Season number of the episode currently being watched (TV shows only).
          example: 2
        episode:
          type: integer
          minimum: 1
          description: Episode number currently being watched (TV shows only).
          example: 5
        updatedAt:
          type: string
          format: date-time
          description: When this position was last recorded.
          example: "2026-01-15T20:00:00.000Z"
      additionalProperties: false
    TitleState:
      type: object
      description: The active profile's complete state for a title — returned by `getTitleState` and by every title state write.
      required:
        - mediaId
        - mediaType
        - watchlist
        - watched
        - completed
        - plays
      properties:
        mediaId:
          type: string
          description: The title's media ID (`MV_<id>` or `TV_<id>`).
          example: TV_1396
        mediaType:
          type: string
          enum:
            - movie
            - tv
          description: Whether this title is a movie or a TV show.
          example: tv
        rating:
          anyOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
          description: The profile's rating (`liked`, `disliked`, `super_liked`), or `null` if unrated.
        watchlist:
          type: boolean
          description: Whether the title is on the profile's watchlist.
          example: true
        watched:
          type: boolean
          description: Whether the profile has played any of this title, even briefly. Use `completed` for a "Watched" checkmark.
          example: true
        completed:
          type: boolean
          description: Whether the profile has finished the title (≥ 80% for a movie; every aired episode of every regular season for a TV show; specials excluded).
          example: false
        completedSeasons:
          type: array
          description: TV shows only — regular season numbers (1 and up) whose aired episodes are all watched.
          items:
            type: integer
          example:
            - 1
            - 2
        episodes:
          type: object
          description: TV shows only — map from season number (as string) to sorted watched episode numbers.
          additionalProperties:
            type: array
            items:
              type: integer
          example:
            "1":
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
              - 7
        plays:
          type: integer
          minimum: 0
          description: Number of completed plays (of the movie or of episodes).
          example: 7
        playback:
          anyOf:
            - $ref: "#/components/schemas/TitlePlayback"
            - type: "null"
          description: Live resume position if the viewer is currently mid-watch, or `null` otherwise.
        providers:
          type: array
          description: Streaming services where this title is available, filtered to the account's selected providers. Present only when `providers=true` is passed to `getTitleState`.
          items:
            $ref: "#/components/schemas/ProviderInfo"
      additionalProperties: false
    SeasonEpisodeState:
      type: object
      description: Whether the active profile has finished one episode of a season.
      required:
        - episode
        - completed
      properties:
        episode:
          type: integer
          minimum: 1
          description: Episode number within the season.
          example: 1
        completed:
          type: boolean
          description: Whether the profile has finished this episode.
          example: true
      additionalProperties: false
    SeasonState:
      type: object
      description: Per-episode completion state for one TV season, plus whether the season as a whole is complete.
      required:
        - season
        - completed
        - episodes
      properties:
        season:
          type: integer
          minimum: 0
          description: The season number.
          example: 1
        completed:
          type: boolean
          description: Whether every aired episode of this season is watched.
          example: false
        episodes:
          type: array
          description: Completion state for every episode in the season.
          items:
            $ref: "#/components/schemas/SeasonEpisodeState"
      additionalProperties: false
    TitleListItem:
      description: A title from a profile's rating, watchlist, or watch-history list, with display artwork and state summary.
      type: object
      required:
        - id
        - mediaType
        - title
        - poster_path
        - backdrop_path
        - watchlist
        - updatedAt
      properties:
        id:
          type: string
          description: The DiscovrID (`TV_<number>` or `MV_<number>`).
          example: MV_550
        ref:
          type: string
          description: |
            This item's `id` with the list it came from attached.

            Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, rating it, or removing it from a list. A bare `id` always works; `ref` is never required.
          example: MV_550@Pc1tD7vKj3NxU6eO
        mediaType:
          type: string
          enum:
            - movie
            - tv
          description: The type of media.
          example: movie
        title:
          type: string
          description: The title of the media.
          example: Fight Club
        poster_path:
          type:
            - object
            - "null"
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        backdrop_path:
          type:
            - object
            - "null"
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        rating:
          anyOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
          description: The profile's rating for this title, or `null` if unrated.
        watchlist:
          type: boolean
          description: Whether this title is on the profile's watchlist.
          example: false
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for the active sort dimension (rated time, watchlisted time, or last watched time).
          example: "2026-01-15T20:00:00.000Z"
        completed:
          type: boolean
          description: Present on `watched=true` results — whether the title is fully finished.
          example: true
        plays:
          type: integer
          minimum: 0
          description: Present on `watched=true` results — total completed plays.
          example: 1
        season:
          type: integer
          minimum: 1
          description: Present on `watched=true` TV results — most recently watched season number.
          example: 2
        episode:
          type: integer
          minimum: 1
          description: Present on `watched=true` TV results — most recently watched episode number.
          example: 5
        imported:
          type: string
          description: Present on `watched=true` results when imported from an external source (e.g., `"trakt"`).
          example: trakt
      additionalProperties: false
    TitleListResponse:
      description: Paginated list of titles. Pass `nextPageToken` to fetch the next page.
      type: object
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          description: Array of title list items.
          items:
            $ref: "#/components/schemas/TitleListItem"
        hasMore:
          type: boolean
          description: Whether more items are available.
          example: true
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results.
      additionalProperties: false
    PlaybackItem:
