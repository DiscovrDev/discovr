          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the history entry was last updated
          example: "2023-01-15T00:00:00.000Z"
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Playback progress percentage (0-100)
          nullable: true
          example: 45.5
        completed:
          type: boolean
          description: Whether the media is considered completed (progress >= 80%)
          example: false
        watched_count:
          type: integer
          minimum: 0
          description: How many times the profile has finished this title (or episode). `0` means it has been started but not finished.
