  /profile/titles/{mediaId}:
    get:
      tags:
        - Discovr
        - Profile Lists
      x-sdk-group: Title State
      summary: Get the active profile's state for a title
      description: |
        Returns everything your UI needs to show the active profile's relationship with a title:

        - **Rating**: `liked`, `disliked`, `super_liked`, or `null`.
        - **Watchlist**: whether the title is saved to the watchlist.
        - **Watch progress & completion**: whether the profile has started (`watched`) or finished (`completed`) the title, total `plays`, watched `episodes` and `completedSeasons` for TV shows, and the live `playback` resume position when mid-watch.
        - **Providers** *(optional)*: pass `providers=true` to include streaming availability filtered to the account's chosen services.

        **Title opens & recommendations.** Calling `GET /profile/titles/{mediaId}` records that the viewer opened the title and directly affects the profile's recommendations. Only call it when the title screen actually opens — prefetching or calling it on hover/focus registers every loaded tile similarly to the viewer liking the title and will skew their recommendations. Every state write (`setRating`, `clearRating`, `addToWatchlist`, `removeFromWatchlist`, `markWatched`, `markUnwatched`) returns the updated `TitleState`, so you don't need to refetch this endpoint after a change.

        **Auth tier:** session — send your session token in `Authorization: Bearer`.
      operationId: getTitleState
      x-cache-policy: none
      security:
        - BearerAuth: []
      parameters:
        - name: mediaId
          in: path
          required: true
          description: |
            The title's media ID (`MV_<id>` for movies, `TV_<id>` for TV shows).

            Also accepts an item's `ref` in place of the ID. Prefer the `ref` when you have one — it resolves to the same title and sharpens recommendations.
          schema:
            type: string
          example: MV_550
        - name: providers
          in: query
          required: false
          description: Set to `true` to include streaming provider availability filtered to the account's selected services.
