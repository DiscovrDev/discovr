            Whether the profile has completed this title (progress ≥ 80% for movies; all seasons complete for TV shows).
        completedSeasons:
          type: array
          description: |
            TV shows only — the season numbers the profile has fully completed. Not present for movies.
          items:
            type: integer
        providers:
          type: array
          description: |
            Streaming services where this title is available, filtered to the profile's selected providers. Only included when `providers=true` is passed. For the full, unfiltered list see `watch_providers` on the base `GET /media/{id}` response.
          items:
            $ref: "#/components/schemas/ProviderInfo"
      required:
        - watchlist
        - liked
        - disliked
        - super_liked
        - playback
        - history
        - completed
    SearchResult:
      type: object
      description: A single search result — could be a movie, TV show, or person.
      required:
        - id
        - tmdb_id
        - media_type
      properties:
        id:
          type: string
          description: |
            Unique identifier. `TV_<id>` for TV shows, `MV_<id>` for movies, or the raw numeric ID for people.
          example: TV_1396
        tmdb_id:
          type: integer
          description: The numeric ID for this title or person.
          example: 1396
        media_type:
          type: string
          enum:
            - movie
            - tv
            - person
          description: Whether this result is a movie, TV show, or person.
        ref:
          type: string
          description: |
            This result's `id` with the search it came from attached.

            Prefer it wherever you'd pass this result's `id` onward — opening its detail screen, adding it to a list. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            Absent on people, who have no detail screen to open. A bare `id` always works; `ref` is never required.
          example: MV_603@Qf7mT2xLk9ZpR4vN
        title:
          type: string
          description: Movie title. TV shows use `name`, people use `name` too.
        name:
          type: string
          description: Show or person name. Movies use `title` instead.
        original_title:
          type: string
          description: Movie title in its original language.
        original_name:
          type: string
          description: Show name in its original language.
        overview:
          type: string
          description: Short synopsis. Not present for `person` results.
        poster_path:
          type: object
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). Absent for `person` results.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        backdrop_path:
          type: object
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). Absent for `person` results.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        release_date:
          type: string
          format: date
          description: Release date for `movie` results, as `YYYY-MM-DD`.
        first_air_date:
          type: string
          format: date
          description: First air date for `tv` results, as `YYYY-MM-DD`.
        popularity:
          type: number
          description: Relative popularity score. Comparable between results, but has no fixed upper bound, so treat it as a sort key rather than something to display.
        vote_average:
          type: number
          description: Average audience rating out of 10. Not present for `person` results.
        vote_count:
          type: integer
          description: How many ratings `vote_average` is based on. Not present for `person` results.
        profile_path:
          type: object
          description: Headshot image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). Only present for `person` results.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        known_for_department:
          type: string
          description: The department this person is best known for, e.g. `Acting` or `Directing`.
          example: Directing
        known_for:
          type: array
          description: |
            A few titles this person is best known for. Only present for `person` results.

            Because a person has no detail view of its own, these are the natural next step after a person result — each carries an `id` you can pass straight to `/media/{mediaId}`.
          items:
            $ref: "#/components/schemas/KnownForItem"
    SearchResponse:
