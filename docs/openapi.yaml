    ApiErrorCode:
      type: string
      description: Machine-readable kebab-case error code returned in the `error` field of every API error response.
      enum:
        - not-found
        - duplicate
        - invalid-input
        - permission-denied
        - method-not-allowed
        - internal-error
        - data-integrity
        - upstream-unavailable
        - service-unavailable
        - demo-unavailable
        - direct-access-denied
        - rate-limited
        - profile-not-found
        - cursor-expired
        - session-expired
        - session-already-consumed
        - session-not-found
        - device-code-expired
        - device-code-already-consumed
        - device-code-denied
        - device-code-busy
        - device-code-not-found
        - token-invalid
        - token-expired
        - wrong-token-kind
        - client-not-found
        - client-mismatch
        - redirect-uri-not-registered
        - redirect-uri-invalid
        - opener-origin-not-allowed
        - code-challenge-required
        - code-challenge-invalid
        - code-verifier-invalid
        - access-not-granted
        - legal-acceptance-required
    ApiError:
      type: object
      description: An API error response. `error` is a machine-readable kebab-case code from `ApiErrorCode`; `message` is an optional developer-facing detail. The SDKs translate these codes into typed errors, so most apps never read the raw JSON.
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
          description: Optional human-readable detail for debugging. Omitted on `500` responses.
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Present on `429 rate-limited` responses. Seconds until the current limit window rolls over.
        tokenKind:
          type: string
          enum:
            - session
            - refresh
          description: Present on `401 token-expired` responses. Identifies which credential expired.
        expected:
          type: string
          enum:
            - session
            - refresh
          description: Present on `403 wrong-token-kind` responses. Identifies which credential tier the endpoint expected.
      additionalProperties: false
    RateLimitedError:
      type: object
      description: |
        A `429` error body carrying `error: "rate-limited"` and the wait hint (`retryAfterSeconds`), mirroring the `Retry-After` header.
      required:
        - error
        - retryAfterSeconds
      properties:
        error:
          type: string
          enum:
            - rate-limited
          description: Machine-readable error code. Always `rate-limited` for a `429`.
          example: rate-limited
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Seconds until the current limit window rolls over. Mirrors the `Retry-After` header.
          example: 14
      additionalProperties: false
    RowType:
      type: string
      enum:
        - media
        - navigation
        - provider
        - top_n
      description: Type of row - media, navigation, provider, or top_n
    MediaItemType:
      type: string
      enum:
        - media
      description: Discriminator value indicating a media item
    NavigationItemType:
      type: string
      enum:
        - navigation
      description: Discriminator value indicating a navigation item
    ProviderItemType:
      type: string
      enum:
        - provider
      description: Discriminator value indicating a provider item
    Page:
      type: object
      description: A recommendation page containing rows of media titles. Its ID comes from its filters alone, so the same page keeps the same ID for every profile, on every device, indefinitely.
      required:
        - id
        - createdAt
        - hero
      properties:
        id:
          type: string
          description: Stable identifier for the page. Safe to store, bookmark or put in a URL.
        createdAt:
          type: string
          format: date-time
          description: When this view of the page was built. Moves when recommendations refresh; it is not the page's own age.
        hero:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/MediaItem"
          description: |
            Exactly 10 featured titles for the hero section. They are ordinary `MediaItem`s, and every one has a `logo_path`.
        name:
          type: string
          description: |
            Human-readable page title, suitable for a breadcrumb (e.g. "Movies & Series • Anime • Fantasy").

            Present only for pages that carry their own name — navigation tiles and
            built-in pages. `POST /pages` takes no name, so a page you create from
            filters alone has none. Absent otherwise — read it defensively.
      additionalProperties: false
    Row:
      type: object
      description: A single row within a page — a labeled group of media items with display info and pagination cursor.
      required:
        - id
        - title
        - pageId
        - type
        - index
        - createdAt
      properties:
        id:
          type: string
          description: |
            Opaque reference to this row. Pass it back unchanged to fetch the row's items. It stays valid across a recommendations refresh, so a rail the user has already opened keeps working.
        title:
          type: string
          description: Display title for the row
        pageId:
          type: string
          description: The stable ID of the page this row belongs to — the same value you passed in.
        type:
          $ref: "#/components/schemas/RowType"
          description: Type of row - media rows contain media items, navigation rows contain navigation items, provider rows contain provider items, top_n rows contain media items (same as media rows but distinguished by type)
        index:
          type: integer
          format: int32
          description: Display order of this row within the page (lower values appear first)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
      additionalProperties: false
    CreatePagePayload:
      type: object
      description: Optional filters to shape the recommendation page. Omit for a default page based on the profile's full taste history.
      properties:
        pageFilters:
          description: Filters that shape which titles appear in the page's rows.
          $ref: "#/components/schemas/FilterSpec"
      additionalProperties: false
    CreatePageResponse:
      type: object
      description: The page's ID and the filters it stands for. Pass the `id` to `GET /pages/{pageId}` or `GET /pages/{pageId}/rows`.
      required:
        - id
      properties:
        id:
          type: string
          description: Stable identifier for the page. Safe to bookmark, store, or put in a URL.
        pageFilters:
          description: Filters that shape which titles appear in the page's rows.
          $ref: "#/components/schemas/FilterSpec"
      additionalProperties: false
    GetRowsResponse:
      type: object
      description: Paginated list of rows for the page.
      required:
        - rows
        - hasMore
      properties:
        rows:
          type: array
          description: Rows in this page, in the order they should be rendered.
          items:
            $ref: "#/components/schemas/Row"
        hasMore:
          type: boolean
          description: Whether there are more rows available
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    GetRowItemsResponse:
      type: object
      description: Paginated list of items within a row.
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RowItem"
          description: Array of row items - can be MediaItem, NavigationItem, or ProviderItem based on the row type
        hasMore:
          type: boolean
          description: Whether there are more items available
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    MediaItem:
      type: object
      description: "A title in a row or the hero, with display metadata. The hero is a placement, not a type: its items are `MediaItem`s too."
      required:
        - id
        - title
        - overview
        - media_type
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the media item
        title:
          type: string
          description: Title of the media item
        overview:
          type:
            - string
            - "null"
          description: Synopsis/summary text for this title.
        poster_path:
          type:
            - object
            - "null"
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        backdrop_path:
          type:
            - object
            - "null"
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        media_type:
          type: string
          enum:
            - movie
            - tv
          description: Type of media
        year:
          type: integer
          description: Release year (the first air year for TV). Absent when the title has no date.
          example: 1999
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Average viewer rating out of 10, to one decimal. Absent until a title has votes.
          example: 8.4
        genres:
          type: array
          items:
            type: string
          description: Genre names, most relevant first. Absent when none are known.
          example:
            - Drama
            - Thriller
        logo_path:
          type:
            - object
            - "null"
          description: |
            Title logo image URLs (English preferred) keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). `null` when the title has no logo. Always present on `hero` items. On row items it is added when the items are served, and is absent only if the catalogue couldn't be reached for that title; fetch the row's items again to fill it in.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/wwemzKWzjKYJFfCeiB57q3r4Bcm.png
            w500: https://cdn.example.com/w500/wwemzKWzjKYJFfCeiB57q3r4Bcm.png
            original: https://cdn.example.com/original/wwemzKWzjKYJFfCeiB57q3r4Bcm.png
        trailer:
          anyOf:
            - $ref: "#/components/schemas/MediaItemTrailer"
            - type: "null"
          description: The best trailer for the title, picked the same way as `getMediaAssets`. `null` when it has none. Added to row items when they are served; absent under the same conditions as `logo_path`.
        runtime:
          type: integer
          description: Running time in minutes. Movies only, and absent when the catalogue has none. Added to row items when they are served.
          example: 139
        number_of_seasons:
          type: integer
          description: How many seasons the show has. TV only, and absent when the catalogue has none. Added to row items when they are served.
          example: 5
        type:
          $ref: "#/components/schemas/MediaItemType"
          description: Discriminator field indicating this is a media item
        ref:
          type: string
          description: |
            This item's `id` with the place it was shown attached.

            Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, adding it to a list, scrobbling it. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            A bare `id` always works; `ref` is never required.
          example: MV_550@Lw2rC9sYh5TaB8kF
      additionalProperties: false
    MediaItemTrailer:
      type: object
      description: The best trailer or clip for a title.
      required:
        - key
        - url
      properties:
        key:
          type: string
          description: YouTube video identifier.
          example: 6ZfuNTqbHE8
        url:
          type: string
          description: Full YouTube watch URL.
          example: https://www.youtube.com/watch?v=6ZfuNTqbHE8
      additionalProperties: false
    NavigationItem:
      type: object
      description: A tile that drills into another page rather than opening a title — a genre, a decade, a curated collection.
      required:
        - id
        - title
        - page_id
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the navigation item
        title:
          type: string
          description: Title of the navigation item
        vertical_path:
          type:
            - object
            - "null"
          description: |
            Vertical tile image URLs keyed by size: `original` (800×1200) and `thumbnail` (400×600), pre-rendered at build time.
          additionalProperties:
            type: string
            format: uri
          example:
            original: https://cdn.example.com/rows/keyword-nav-vertical.jpg
            thumbnail: https://cdn.example.com/rows/keyword-nav-vertical-thumbnail.jpg
        horizontal_path:
          type:
            - object
            - "null"
          description: |
            Horizontal tile image URLs keyed by size: `original` (1080×608) and `thumbnail` (540×304), pre-rendered at build time.
          additionalProperties:
            type: string
            format: uri
          example:
            original: https://cdn.example.com/rows/keyword-nav-horizontal.jpg
            thumbnail: https://cdn.example.com/rows/keyword-nav-horizontal-thumbnail.jpg
        page_id:
          type: string
          description: ID of the page this navigation item links to
        ref:
          type: string
          description: |
            This tile's `page_id` with the place it was shown attached.

            Prefer it over `page_id` when opening the page this tile links to. It resolves to the same page and sharpens the user's recommendations. Use it for the profile it was returned to.

            A bare `page_id` always works; `ref` is never required.
          example: k7Qm2xR9pT@Ju4nE1oZd6XcV3gP
        type:
          $ref: "#/components/schemas/NavigationItemType"
          description: Discriminator field indicating this is a navigation item
      additionalProperties: false
    ProviderItem:
      type: object
      description: A tile for a streaming service, drilling into what's available on it.
      required:
        - id
        - title
        - page_id
        - type
        - paths
      properties:
        id:
          type: string
          description: Unique identifier for the provider item
        title:
          type: string
          description: Title of the provider (streaming service name)
        page_id:
          type: string
          description: ID of the page this provider item links to
        ref:
          type: string
          description: |
            This tile's `page_id` with the place it was shown attached.

            Prefer it over `page_id` when opening the page this tile links to. It resolves to the same page and sharpens the user's recommendations. Use it for the profile it was returned to.

            A bare `page_id` always works; `ref` is never required.
          example: k7Qm2xR9pT@Ju4nE1oZd6XcV3gP
        type:
          $ref: "#/components/schemas/ProviderItemType"
          description: Discriminator field indicating this is a provider item
        paths:
          type: object
          description: Square Logo URLs in various resolutions (keys are resolution IDs like "60", "100", "512", "1024")
          additionalProperties:
            type: string
            format: uri
          example:
            "60": https://is1-ssl.mzstatic.com/image/thumb/.../60x60bb.jpg
            "100": https://is1-ssl.mzstatic.com/image/thumb/.../100x100bb.jpg
            "512": https://is1-ssl.mzstatic.com/image/thumb/.../512x512bb.jpg
            "1024": https://is1-ssl.mzstatic.com/image/thumb/.../1024x1024bb.png
      additionalProperties: false
    RowItem:
      oneOf:
        - $ref: "#/components/schemas/MediaItem"
        - $ref: "#/components/schemas/NavigationItem"
        - $ref: "#/components/schemas/ProviderItem"
      discriminator:
        propertyName: type
        mapping:
          media: "#/components/schemas/MediaItem"
          navigation: "#/components/schemas/NavigationItem"
          provider: "#/components/schemas/ProviderItem"
      description: |
        A row item can be a MediaItem, NavigationItem, or ProviderItem.
        Use the `type` field to determine which type it is:
        - `type: "media"` indicates a MediaItem (has `media_type` field)
        - `type: "navigation"` indicates a NavigationItem (has `page_id` field)
        - `type: "provider"` indicates a ProviderItem (has `paths` field with resolution URLs)
    FilterSpec:
      type: object
      description: Filters that shape which titles appear in a page's rows. All filters are optional.
      properties:
        genres:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          description: Genre IDs to filter by
        keywords:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          description: Keyword IDs to filter by
        media_type:
          type: string
          enum:
            - movie
            - tv
            - all
          description: Media type filter
        region:
          type: array
          items:
            type: string
            minLength: 1
          description: Region codes (e.g., "US", "GB")
        with_runtime_gte:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          description: Minimum runtime in minutes
        with_runtime_lte:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          description: Maximum runtime in minutes
        with_release_date_gte:
          type:
            - string
            - "null"
          format: date
          description: Earliest release date (YYYY-MM-DD)
        with_release_date_lte:
          type:
            - string
            - "null"
          format: date
          description: Latest release date (YYYY-MM-DD)
        with_watch_providers:
          type: array
          items:
            type: string
            minLength: 1
          description: Streaming provider IDs
      additionalProperties: false
    Genre:
      type: object
      description: A catalogue genre.
      required:
        - tmdb_id
        - name
      properties:
        tmdb_id:
          type: integer
          description: Genre identifier. Pass this as a `genres` filter when creating a page.
        name:
          type: string
          description: Display name of the genre.
      additionalProperties: false
    MediaResponse:
      type: object
      description: Full details for a movie or TV show.
      required:
        - id
        - media_type
      properties:
        id:
          type: string
          description: The unique identifier of the media item.
        media_type:
          type: string
          enum:
            - movie
            - tv
          description: Whether this is a movie or TV show.
        movie:
          $ref: "#/components/schemas/MediaResponseMovie"
        tv:
          $ref: "#/components/schemas/MediaResponseTv"
        watch_providers:
          type: array
          description: |
            Full list of where this title is available, not filtered to any profile's preferences. Use `GET /profile/titles/{mediaId}` with `providers=true` for a personalized, preference-filtered provider list. Provider data sourced from JustWatch.
          items:
            $ref: "#/components/schemas/ProviderInfo"
        credits:
          $ref: "#/components/schemas/MediaCredits"
        external_ids:
          $ref: "#/components/schemas/MediaExternalIds"
      additionalProperties: false
    MediaResponseMovie:
      type: object
      description: Movie details — only present when `media_type` is `movie`.
      properties:
        id:
          type: string
          description: The Discovr media ID for this movie — the `MV_<id>` value you pass to other endpoints.
        tmdb_id:
          type: integer
          description: Catalogue identifier for this movie, without the `MV_` prefix.
        title:
          type: string
          description: Display title, localised where a translation is available.
        original_title:
          type: string
          description: Title in the movie's original language. Differs from `title` for translated releases.
        overview:
          type:
            - string
            - "null"
          description: Short synopsis, suitable for a detail sheet.
        poster_path:
          type:
            - object
            - "null"
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        backdrop_path:
          type:
            - object
            - "null"
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        release_date:
          type:
            - string
            - "null"
          format: date
          description: Theatrical or first release date, as `YYYY-MM-DD`, or `null` when unknown.
        runtime:
          type:
            - integer
            - "null"
          description: Length in whole minutes, or `null` when unknown.
        vote_average:
          type: number
          description: Average audience rating out of 10.
        vote_count:
          type: integer
          description: How many ratings `vote_average` is based on — useful for deciding whether to show the score at all.
        popularity:
          type: number
          description: Relative popularity score. Comparable between titles, but has no fixed upper bound, so treat it as a sort key rather than something to display.
        genres:
          type: array
          description: Genres this movie belongs to.
          items:
            $ref: "#/components/schemas/Genre"
        tagline:
          type:
            - string
            - "null"
          description: Short marketing line, where one exists.
        status:
          type: string
          description: Release status, such as `Released`, `In Production`, or `Post Production`.
        budget:
          type: integer
          description: Production budget in US dollars. `0` when unknown.
        revenue:
          type: integer
          description: Worldwide box office in US dollars. `0` when unknown.
        homepage:
          type:
            - string
            - "null"
          description: Official site for the movie, where one exists.
        imdb_id:
          type:
            - string
            - "null"
          description: IMDb identifier, for linking out to IMDb.
      additionalProperties: false
    MediaResponseTv:
      type: object
      description: TV show details — only present when `media_type` is `tv`.
      properties:
        id:
          type: string
          description: The Discovr media ID for this show — the `TV_<id>` value you pass to other endpoints.
        tmdb_id:
          type: integer
          description: Catalogue identifier for this show, without the `TV_` prefix.
        name:
          type: string
          description: Display name, localised where a translation is available.
        original_name:
          type: string
          description: Name in the show's original language. Differs from `name` for translated releases.
        overview:
          type:
            - string
            - "null"
          description: Short synopsis, suitable for a detail sheet.
        poster_path:
          type:
            - object
            - "null"
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        backdrop_path:
          type:
            - object
            - "null"
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        first_air_date:
          type:
            - string
            - "null"
          format: date
          description: Date the first episode aired, as `YYYY-MM-DD`, or `null` when unknown.
        last_air_date:
          type:
            - string
            - "null"
          format: date
          description: Date the most recent episode aired, as `YYYY-MM-DD`, or `null` when unknown.
        number_of_episodes:
          type: integer
          description: Total episodes released across every season.
        number_of_seasons:
          type: integer
          description: Total seasons released.
        vote_average:
          type: number
          description: Average audience rating out of 10.
        vote_count:
          type: integer
          description: How many ratings `vote_average` is based on — useful for deciding whether to show the score at all.
        popularity:
          type: number
          description: Relative popularity score. Comparable between titles, but has no fixed upper bound, so treat it as a sort key rather than something to display.
        genres:
          type: array
          description: Genres this show belongs to.
          items:
            $ref: "#/components/schemas/Genre"
        tagline:
          type:
            - string
            - "null"
          description: Short marketing line, where one exists.
        status:
          type: string
          description: Production status, such as `Returning Series`, `Ended`, or `Canceled`.
        homepage:
          type:
            - string
            - "null"
          description: Official site for the show, where one exists.
        in_production:
          type: boolean
          description: Whether more episodes are still being made.
        seasons:
          type: array
          description: Every season of the show, including specials as season `0` where one exists.
          items:
            $ref: "#/components/schemas/MediaResponseTvSeason"
      additionalProperties: false
    MediaResponseTvSeason:
      type: object
      description: Summary of one season on a TV show's details. Use `getSeasonDetails` for full episode listings.
      properties:
        tmdb_id:
          type: integer
          description: Catalogue identifier for this season.
        name:
          type: string
          description: Display name of the season, such as `Season 1` or `Specials`.
        episode_count:
          type: integer
          description: Episodes in this season.
        season_number:
          type: integer
          description: Position of the season, starting at `1`. Specials use `0`. Pass this to `getSeasonDetails`.
        air_date:
          type:
            - string
            - "null"
          format: date
          description: Date the season's first episode aired, as `YYYY-MM-DD`, or `null` when unknown.
        poster_path:
          type:
            - object
            - "null"
          description: Season poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
      additionalProperties: false
    MediaCredits:
      type: object
      description: Who is in a title and who made it. Cast is the top-billed 15, in billing order. Crew is limited to directors and writers, plus a show's creators for TV.
      required:
        - cast
        - crew
      properties:
        cast:
          type: array
          description: Up to 15 top-billed cast members, in billing order.
          items:
            $ref: "#/components/schemas/CastMember"
        crew:
          type: array
          description: Directors and writers. For TV it also lists the show's creators, with `job` set to `Creator`.
          items:
            $ref: "#/components/schemas/CrewMember"
      additionalProperties: false
    CastMember:
      type: object
      description: One cast member of a title.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: Catalogue identifier for the person. Stable across titles.
          example: 6384
        name:
          type: string
          description: The person's name.
          example: Keanu Reeves
        character:
          type:
            - string
            - "null"
          description: The role they play. `null` when the catalogue doesn't list one.
          example: Neo
        profile_path:
          type:
            - object
            - "null"
          description: Portrait URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`), or `null` when there is no photo.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/8RZLOyYGsoRe9p44q3xin9QkMHv.jpg
            original: https://cdn.example.com/original/8RZLOyYGsoRe9p44q3xin9QkMHv.jpg
      additionalProperties: false
    CrewMember:
      type: object
      description: A director, writer or creator of a title.
      required:
        - id
        - name
        - job
      properties:
        id:
          type: integer
          description: Catalogue identifier for the person. Stable across titles.
          example: 9340
        name:
          type: string
          description: The person's name.
          example: Lana Wachowski
        job:
          type: string
          description: Their role on the title, such as `Director`, `Screenplay`, `Writer` or `Creator`.
          example: Director
        profile_path:
          type:
            - object
            - "null"
          description: Portrait URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`), or `null` when there is no photo.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/fTE4gvedUe9xJRAdKUnCM09TkwZ.jpg
            original: https://cdn.example.com/original/fTE4gvedUe9xJRAdKUnCM09TkwZ.jpg
      additionalProperties: false
    MediaExternalIds:
      type: object
      description: The title's identifiers on other services, for deep links and cross-referencing.
      properties:
        imdb_id:
          type:
            - string
            - "null"
          description: IMDb identifier, such as `tt0133093`. `null` when none is known.
          example: tt0133093
        tvdb_id:
          type:
            - integer
            - "null"
          description: TheTVDB identifier. TV only; `null` for movies and for shows with none.
          example: 81189
      additionalProperties: false
    ProviderInfo:
      type: object
      description: A streaming service and the regions where this title is available on it.
      required:
        - id
        - title
        - logos
        - regions
      properties:
        id:
          type: string
          description: Provider identifier.
          example: "119"
        title:
          type: string
          description: Display name of the streaming service.
          example: Amazon Prime Video
        logos:
          type: object
          description: Square logo images at various sizes, keyed by pixel dimension.
          additionalProperties:
            type: string
            format: uri
          example:
            "60": https://is1-ssl.mzstatic.com/image/thumb/.../60x60bb.jpg
            "100": https://is1-ssl.mzstatic.com/image/thumb/.../100x100bb.jpg
            "512": https://is1-ssl.mzstatic.com/image/thumb/.../512x512bb.jpg
            "1024": https://is1-ssl.mzstatic.com/image/thumb/.../1024x1024bb.png
        regions:
          type: object
          description: |
            Regions where this provider has the title available, keyed by ISO 3166-1 alpha-2 country code.
          additionalProperties:
            $ref: "#/components/schemas/ProviderInfoRegion"
      additionalProperties: false
    ProviderInfoRegion:
      type: object
      description: Availability of a title on a streaming provider in a single region.
      required:
        - english_name
        - native_name
        - link
      properties:
        english_name:
          type: string
          description: English name of the region.
          example: United States
        native_name:
          type: string
          description: Region name in the local language.
          example: United States
        link:
          type: string
          format: uri
          description: Link to the watch page for this title in this region.
          example: https://example.com/movie/550/watch?locale=US
      additionalProperties: false
    SearchResult:
      type: object
      description: A single search result — could be a movie, TV show, or person.
      required:
        - id
        - tmdb_id
        - media_type
      properties:
        id:
          type: string
          description: |
            Unique identifier. `TV_<id>` for TV shows, `MV_<id>` for movies, or the raw numeric ID for people.
          example: TV_1396
        tmdb_id:
          type: integer
          description: The numeric ID for this title or person.
          example: 1396
        media_type:
          type: string
          enum:
            - movie
            - tv
            - person
          description: Whether this result is a movie, TV show, or person.
        ref:
          type: string
          description: |
            This result's `id` with the search it came from attached.

            Prefer it wherever you'd pass this result's `id` onward — opening its detail screen, adding it to a list. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            Absent on people, who have no detail screen to open. A bare `id` always works; `ref` is never required.
          example: MV_603@Qf7mT2xLk9ZpR4vN
        title:
          type: string
          description: Movie title. TV shows use `name`, people use `name` too.
        name:
          type: string
          description: Show or person name. Movies use `title` instead.
        original_title:
          type: string
          description: Movie title in its original language.
        original_name:
          type: string
          description: Show name in its original language.
        overview:
          type:
            - string
            - "null"
          description: Short synopsis. Not present for `person` results.
        poster_path:
          type:
            - object
            - "null"
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). Absent for `person` results.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        backdrop_path:
          type:
            - object
            - "null"
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). Absent for `person` results.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        release_date:
          type:
            - string
            - "null"
          format: date
          description: Release date for `movie` results, as `YYYY-MM-DD`, or `null` when unknown.
        first_air_date:
          type:
            - string
            - "null"
          format: date
          description: First air date for `tv` results, as `YYYY-MM-DD`, or `null` when unknown.
        popularity:
          type: number
          description: Relative popularity score. Comparable between results, but has no fixed upper bound, so treat it as a sort key rather than something to display.
        vote_average:
          type: number
          description: Average audience rating out of 10. Not present for `person` results.
        vote_count:
          type: integer
          description: How many ratings `vote_average` is based on. Not present for `person` results.
        profile_path:
          type:
            - object
            - "null"
          description: Headshot image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`). Only present for `person` results.
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
        known_for_department:
          type:
            - string
            - "null"
          description: The department this person is best known for, e.g. `Acting` or `Directing`.
          example: Directing
        known_for:
          type: array
          description: |
            A few titles this person is best known for. Only present for `person` results.

            Because a person has no detail view of its own, these are the natural next step after a person result — each carries an `id` you can pass straight to `/media/{mediaId}`.
          items:
            $ref: "#/components/schemas/KnownForItem"
      additionalProperties: false
    KnownForItem:
      type: object
      description: A title a person is known for, returned alongside `person` search results.
      required:
        - id
        - tmdb_id
        - media_type
      properties:
        id:
          type: string
          description: Unique identifier — `TV_<id>` for TV shows, `MV_<id>` for movies. Ready to pass to `/media/{mediaId}`.
          example: MV_872585
        ref:
          type: string
          description: |
            This title's `id` with the search it came from attached.

            Prefer it wherever you'd pass this title's `id` onward — opening its detail screen, adding it to a list. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            A bare `id` always works; `ref` is never required.
          example: MV_872585@Hd3yW8cBn5JtK1aS
        tmdb_id:
          type: integer
          description: The numeric ID for this title.
          example: 872585
        media_type:
          type: string
          enum:
            - movie
            - tv
          description: Whether this title is a movie or a TV show.
        title:
          type: string
          description: Movie title. TV shows use `name` instead.
          example: Oppenheimer
        name:
          type: string
          description: TV show name. Movies use `title` instead.
        overview:
          type:
            - string
            - "null"
          description: Short synopsis of the title.
        poster_path:
          type:
            - object
            - "null"
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
        backdrop_path:
          type:
            - object
            - "null"
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
        release_date:
          type:
            - string
            - "null"
          format: date
          description: Release date, for movies, as `YYYY-MM-DD`, or `null` when unknown.
        first_air_date:
          type:
            - string
            - "null"
          format: date
          description: First air date, for TV shows, as `YYYY-MM-DD`, or `null` when unknown.
        vote_average:
          type: number
          description: Average audience rating out of 10.
      additionalProperties: false
    SearchResponse:
      type: object
      description: |
        A page of search results.

        There is no total result count — use `has_more` to page instead.
      required:
        - page
        - results
        - has_more
      properties:
        page:
          type: integer
          description: The page these results came from, starting at 1.
          example: 1
        results:
          type: array
          description: Matched results for the current page, ordered by relevance.
          items:
            $ref: "#/components/schemas/SearchResult"
        has_more:
          type: boolean
          description: Whether another page is available. Request it by passing `page` + 1.
          example: true
      additionalProperties: false
    SimilarResult:
      type: object
      description: A title that's similar to the requested media.
      required:
