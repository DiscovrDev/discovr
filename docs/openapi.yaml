openapi: 3.1.0
info:
  title: The Discovr API
  description: |
    The Discovr API powers personalized recommendation experiences for your streaming app.

    **Authentication.** Two tokens, two jobs:

    - **Refresh token** (long-lived, 90 days). Used for identity-tier
      endpoints — managing profiles, signing out the current device, and
      starting browsing sessions. Treat it as a credential.
    - **Session token** (short-lived, 30 minutes). Scoped to a selected
      profile. Used for session-tier endpoints — pages, rows, items, and
      writes to profile-scoped data.

    Sign in via the web flow or the device-code flow → receive a refresh
    token → call `POST /auth/session-token` with a chosen `profileId` → use
    the returned session token for everything else. SDKs handle this
    transparently; see the
    [Authentication guide](https://docs.discovr.media/guides/authentication).

    **Profiles.** A user can have multiple profiles, each with independent
    likes, history, playback, and watchlists. The active profile is carried
    by the session token, so profile-scoped endpoints don't accept a
    `profileId` path parameter — they live under `/profile/*`.
  version: 1.0.0-alpha.1
  license:
    name: Discovr Developer Terms
    url: https://discovr.media/terms
  contact:
    name: The Discovr API Team
    email: dev@discovr.media
servers:
  - url: https://api.discovr.media
    description: Production
tags:
  - name: Discovr
    description: Unified client API — every operation accessible through one client instance.
  - name: Authentication
    description: Sign-in flows, session-token minting, and session management.
  - name: Profiles
    description: Profile management — list, create, update, and delete profiles.
  - name: Profile Lists
    description: |
      Profile-scoped data — likes, dislikes, super-likes, watchlist, playback
      progress, and watch history. The active profile is carried by the session
      token, so these endpoints don't accept a `profileId` parameter.
  - name: Media
    description: Media details, search, and similar titles.
  - name: Pages
    description: Recommendation pages — stable IDs whose rows refresh periodically.
  - name: Rows
    description: Rows within a recommendation page.
  - name: Misc
    description: Utility endpoints — avatar images and GIF search.
paths:
  /auth/device-codes:
    post:
      tags:
        - Discovr
        - Authentication
      summary: Request device code
      security: []
      description: |
        Starts the TV / device sign-in flow. Call this to get a user code and QR code to display on screen.
        The user opens Discovr on their phone, scans the QR code or types the user code, and confirms sign-in.
        Once they do, your next poll to `/auth/device-codes/{deviceCode}/poll` returns a refresh token.

        **Response format:**
        - `format=json` (default) — returns `{ deviceCode, userCode, authQRCode, verificationUrl, expiresIn, interval }`. The `authQRCode` is a base64 data URL — drop it straight into an `<img>` tag. Show `verificationUrl` next to the code so people who can't scan can type `userCode` there.

        Keep `deviceCode` on the device. It is what you poll with, so it is never put in the QR code or shown to the person; the QR code and the screen carry only `userCode`.
        - `format=image` — returns a raw PNG binary. Handy if you're embedding the image directly without a data URL wrapper.

        **QR code size:**
        Use the `size` parameter to match your display. TV screens benefit from larger codes (600–800 px). Default is 300 px.
      operationId: requestDeviceCode
      parameters:
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 100
            maximum: 1000
            default: 300
          description: QR code size in pixels. Larger sizes are recommended for TV displays.
          example: 600
        - name: format
          in: query
          required: false
          x-ts-coerce: any
          schema:
            type: string
            enum:
              - json
              - image
            default: json
          description: Response format. Use "image" for native clients to receive binary PNG directly.
          example: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodePayload"
            example:
              clientID: abc123xyz
      responses:
        "200":
          description: Device code created successfully. Response format depends on `format` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
              example:
                deviceCode: dvc_abc123xyz789
                userCode: "1234"
                authQRCode: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
                verificationUrl: https://discovr.media/tv-auth
                expiresIn: 600000
                interval: 5
            image/png:
              schema:
                type: string
                format: binary
                description: Binary PNG image of the QR code. Returned when `format=image` query parameter is set.
              example: (binary PNG data)
        "400":
          description: Bad request — missing or invalid clientID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingClientID:
                  value:
                    error: ClientID is required and cannot be empty
                clientNotFound:
                  summary: clientID is not registered
                  value:
                    error: client-not-found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-codeSamples:
        - lang: javascript
          label: TypeScript
          source: |-
            import { DiscovrClient } from "discovr";
            import type { DeviceCodePayload, DeviceCodeResponse } from "discovr";

            const discovr = new DiscovrClient("your-client-id");

            const response: DeviceCodeResponse = await discovr.requestDeviceCode("abc123xyz", { demo: false, size: 600, format: "json" });
            console.log(response);
        - lang: kotlin
          label: Kotlin
          source: |-
            import api.discovr.DiscovrClient
            import api.discovr.models.DeviceCodePayload
            import api.discovr.models.DeviceCodeResponse

            // Construct DiscovrClient with your AuthStorage implementation (see SDK README).
            suspend fun example(client: DiscovrClient) {
                val response: DeviceCodeResponse = client.requestDeviceCode(clientID = "abc123xyz", demo = false, size = 600, format = DiscovrApi.FormatRequestDeviceCode.json)
                println(response)
            }
        - lang: swift
          label: Swift
          source: |-
            import Discovr

            let client = DiscovrClient(clientId: "your-client-id")
            // Response / argument types:
            // DeviceCodePayload, DeviceCodeResponse
            let response: DeviceCodeResponse = try await client.requestDeviceCode(clientID: "abc123xyz", demo: false, size: 600, format: DiscovrAPI.Format_requestDeviceCode.json)
            print(response)
  /auth/device-codes/{deviceCode}/poll:
    post:
      tags:
        - Discovr
        - Authentication
      summary: Poll for auth token
      security: []
      description: |
        The second step of the device code flow. Call this repeatedly after showing the user code or QR code.

        While the user hasn't confirmed yet, you'll get `{ status: "pending", interval }` — wait `interval`
        seconds and poll again. Once they approve, the response changes to `{ refreshToken, publicId, expiresAt }`.
        Store the `refreshToken` securely — it's your long-lived credential for all identity-tier calls.

        **Polling interval:** the server sets it and repeats it in every pending answer; it grows the longer
        the code has been waiting, so always use the latest value. The SDKs do this for you. Stop polling when
        you receive a `refreshToken` or a `401` error.

        A person can decline on their phone. Your next poll then returns `401` with `device-code-denied`
        straight away (and on every poll after, until the code expires), so you can say so on screen instead
        of waiting out the timeout.
      operationId: pollDeviceCode
      parameters:
        - name: deviceCode
          in: path
          required: true
          description: The device code obtained from the request device code endpoint
          schema:
            type: string
          example: dvc_abc123xyz789
      requestBody:
        required: false
        description: |
          Send your `deviceId` so that signing in again on the same device replaces the credential it already held. The
          SDKs send it for you. The body is optional; with none, every sign-in is a credential of its own.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollPayload"
      responses:
        "200":
          description: |
            Poll result. Two possible shapes:
            - **Authorized**: device code was approved — contains `refreshToken`, `publicId`, `expiresAt`.
            - **Pending**: user has not yet approved — contains `status: "pending"` and the `interval` to wait. Keep polling.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RefreshTokenResponse"
                  - $ref: "#/components/schemas/DeviceCodePendingResponse"
              examples:
                authorized:
                  summary: User approved — token issued
                  value:
                    refreshToken: rt_a1b2c3d4e5f6...
                    publicId: MqXYz12abc
                    expiresAt: 1733088000
                pending:
                  summary: User has not yet approved
                  value:
                    status: pending
                    interval: 5
        "400":
          description: Bad request - invalid path structure, or a `deviceId` that is not 32 lowercase hex characters (`invalid-input`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "Invalid path structure. Expected: /auth/device-codes/:deviceCode/poll"
        "401":
          description: |
            Device code expired, already consumed, or declined by the person on their phone.
            The `error` field contains a machine-readable code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                expired:
                  summary: Device code TTL has passed
                  value:
                    error: device-code-expired
                consumed:
                  summary: Device code was already exchanged for a token
                  value:
                    error: device-code-already-consumed
                denied:
                  summary: The person declined the request on their phone
                  value:
                    error: device-code-denied
        "403":
          description: |
            The account is on the closed-programme waitlist and may not be issued a
            credential yet. Deliberately not a `401`: the credential presented was
            valid and re-authenticating will not change the answer, so a client
            that retries on `401` must not retry on this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: access-not-granted
        "404":
          description: Device code does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: device-code-not-found
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-codeSamples:
        - lang: javascript
          label: TypeScript
          source: |-
            import { DiscovrClient } from "discovr";
            import type { DevicePollPayload, PollDeviceCode200Response } from "discovr";

            const discovr = new DiscovrClient("your-client-id");

            const response: PollDeviceCode200Response = await discovr.pollDeviceCode("dvc_abc123xyz789", { deviceId: "7f3a91c2d4e85b60a1c97e24f8d03b5a" });
            console.log(response);
        - lang: kotlin
          label: Kotlin
          source: |-
            import api.discovr.DiscovrClient
            import api.discovr.models.DevicePollPayload
            import api.discovr.models.PollDeviceCode200Response

            // Construct DiscovrClient with your AuthStorage implementation (see SDK README).
            suspend fun example(client: DiscovrClient) {
                val response: PollDeviceCode200Response = client.pollDeviceCode(deviceCode = "dvc_abc123xyz789", deviceId = "7f3a91c2d4e85b60a1c97e24f8d03b5a")
                println(response)
            }
        - lang: swift
          label: Swift
          source: |-
            import Discovr

            let client = DiscovrClient(clientId: "your-client-id")
            // Response / argument types:
            // DevicePollPayload, PollDeviceCode200Response
            let response: PollDeviceCode200Response = try await client.pollDeviceCode(deviceCode: "dvc_abc123xyz789", deviceId: "7f3a91c2d4e85b60a1c97e24f8d03b5a")
            print(response)
  /auth/web/authorize:
    get:
      tags:
        - Discovr
        - Authentication
      summary: Redirect to web authentication
      security: []
      description: |
        Starts a web sign-in: sends the user's browser to the Discovr page where they sign in and approve your app.
        After they do, Discovr hands your app a short-lived, single-use **authorization code** (never the long-lived
        credential), and your app trades it for a refresh token with `POST /auth/web/token`. This is the OAuth
        authorization code flow with PKCE, so the SDKs do all of it for you.

        - **`clientID`** — your registered app ID, so Discovr knows which app is requesting access.
        - **`state`** — your app's CSRF token. Discovr echoes it back unchanged so you can verify the response came from Discovr and not a third party.
        - **`codeChallenge`** / **`codeChallengeMethod`** — `base64url(SHA-256(verifier))` of a random `codeVerifier` you keep, and `S256`. Required on every request.
        - **`redirectURL`** — where to send the user after sign-in; it must be registered for your client. For a popup, send `openerOrigin` instead (the SDK does).

        **What your app receives.** On your `redirectURL` as query parameters, or as a `postMessage` to the popup's opener:
        `{ code, state }` on success, or `{ error, state }` when the person cancels (`authorization-cancelled`) or sign-in cannot
        complete. `error` is one of the codes in `ApiError`. Check `state` first, then redeem `code` with your `codeVerifier`.
      operationId: authorizeClientWeb
      parameters:
        - name: clientID
          in: query
          required: true
          description: The client ID of the third-party application
          schema:
            type: string
          example: abc123xyz
        - name: redirectURL
          in: query
          required: false
          description: |
            Optional custom redirect URL. If omitted, redirects to the hosted callback page at 
            https://auth.discovr.media/callback.html which handles token exchange via postMessage 
            for web popup flows or deep links for mobile apps. Must be URL encoded when provided.
          schema:
            type: string
            format: uri
          example: https://yourapp.com/callback
        - name: state
          in: query
          required: true
          description: |
            Opaque value to prevent CSRF; echoed back in the callback response. 16 to 256 URL-safe characters
            (`A-Z a-z 0-9 - _`); 32 random bytes, hex-encoded, is 64.
          schema:
            type: string
            minLength: 16
            maxLength: 256
          example: 9f2c41d07be34a85b1c6e0d3f7a29c84
        - name: codeChallenge
          in: query
          required: true
          description: |
            `base64url(SHA-256(codeVerifier))`, 43 characters. Generate a fresh random `codeVerifier` per sign-in and keep it;
            you send it to `POST /auth/web/token` when you redeem the code.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        - name: codeChallengeMethod
          in: query
          required: true
          x-ts-coerce: any
          description: Always `S256`. `plain` is not accepted.
          schema:
            type: string
            enum:
              - S256
          example: S256
        - name: platform
          in: query
          required: false
          x-ts-coerce: any
          description: |
            Optional platform hint (web popup, mobile deep link, etc.). Not currently used.
          schema:
            type: string
            enum:
              - web
              - mobile
              - tv
          example: web
      responses:
        "200":
          description: |
            Successful operation (Documentation only).
            In practice, this endpoint always redirects (302).
        "302":
          description: Redirect to authentication page
          headers:
            Location:
              description: The authentication URL
              schema:
                type: string
                format: uri
        "400":
          description: Bad request — missing, invalid, or unregistered query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingClientID:
                  value:
                    error: "Missing or invalid required query parameter: clientID"
                clientNotFound:
                  summary: clientID is not registered
                  value:
                    error: client-not-found
                codeChallengeRequired:
                  summary: No PKCE challenge was sent
                  value:
                    error: code-challenge-required
                codeChallengeInvalid:
                  summary: The challenge is not a base64url SHA-256, or the method is not S256
                  value:
                    error: code-challenge-invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-codeSamples:
        - lang: javascript
          label: TypeScript
          source: |-
            import { DiscovrClient } from "discovr";

            const discovr = new DiscovrClient("your-client-id");

            await discovr.authorizeClientWeb("abc123xyz", "9f2c41d07be34a85b1c6e0d3f7a29c84", "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM", "S256", { redirectURL: "https://yourapp.com/callback", platform: "web" });
        - lang: kotlin
          label: Kotlin
          source: |-
            import api.discovr.DiscovrClient

            // Construct DiscovrClient with your AuthStorage implementation (see SDK README).
            suspend fun example(client: DiscovrClient) {
                client.authorizeClientWeb(clientID = "abc123xyz", state = "9f2c41d07be34a85b1c6e0d3f7a29c84", codeChallenge = "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM", codeChallengeMethod = DiscovrApi.CodeChallengeMethodAuthorizeClientWeb.S256, redirectURL = "https://yourapp.com/callback", platform = DiscovrApi.PlatformAuthorizeClientWeb.web)
            }
        - lang: swift
          label: Swift
          source: |-
            import Discovr

            let client = DiscovrClient(clientId: "your-client-id")
            try await client.authorizeClientWeb(clientID: "abc123xyz", state: "9f2c41d07be34a85b1c6e0d3f7a29c84", codeChallenge: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM", codeChallengeMethod: DiscovrAPI.CodeChallengeMethod_authorizeClientWeb.S256, redirectURL: "https://yourapp.com/callback", platform: DiscovrAPI.Platform_authorizeClientWeb.web)
  /auth/web/token:
    post:
      tags:
        - Discovr
        - Authentication
      summary: Redeem a web sign-in code
      security: []
      description: |
        The last step of a web sign-in. Trade the authorization code Discovr delivered to your app, together with the
        `codeVerifier` you generated when you started, for the refresh token. The SDKs call this for you.

        The code is single-use and lives 60 seconds. A request with a wrong `codeVerifier` fails **and spends the code**, so
        whoever intercepted it gets one try, not unlimited guesses. The refresh token comes back in this response only —
        it is never in a URL or a `postMessage`.
      operationId: exchangeWebAuthCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebTokenPayload"
      responses:
        "200":
          description: Code redeemed — your credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
              example:
                refreshToken: rt_a1b2c3d4e5f6...
                publicId: MqXYz12abc
                expiresAt: 1733088000
        "400":
          description: A required field is missing, or the code, the verifier or the `deviceId` is malformed. A malformed `deviceId` is refused before the code is spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingField:
                  value:
                    error: "Missing or invalid required field: codeVerifier"
                malformed:
                  value:
                    error: invalid-input
        "401":
          description: |
            The code cannot be redeemed. The `error` field is a machine-readable code, and every failed attempt
            spends the code, so start a new sign-in rather than retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                wrongVerifier:
                  summary: The verifier does not match the challenge the sign-in started with
                  value:
                    error: code-verifier-invalid
                expired:
                  summary: The 60 seconds are up
                  value:
                    error: session-expired
                used:
                  summary: The code was already redeemed
                  value:
                    error: session-already-consumed
                wrongClient:
                  summary: The code belongs to a different client
                  value:
                    error: client-mismatch
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-codeSamples:
        - lang: javascript
          label: TypeScript
          source: |-
            import { DiscovrClient } from "discovr";
            import type { RefreshTokenResponse, WebTokenPayload } from "discovr";

            const discovr = new DiscovrClient("your-client-id");

            const response: RefreshTokenResponse = await discovr.exchangeWebAuthCode("abc123xyz", "Gh2kd9QpXw3LmN7vRtYa.k3J9xQmPz1VbT6uYhN4oWcE8sA2dF5gLrXiUqZjKvBeM", "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk", { deviceId: "7f3a91c2d4e85b60a1c97e24f8d03b5a" });
            console.log(response);
        - lang: kotlin
          label: Kotlin
          source: |-
            import api.discovr.DiscovrClient
            import api.discovr.models.RefreshTokenResponse
            import api.discovr.models.WebTokenPayload

            // Construct DiscovrClient with your AuthStorage implementation (see SDK README).
            suspend fun example(client: DiscovrClient) {
                val response: RefreshTokenResponse = client.exchangeWebAuthCode(clientID = "abc123xyz", code = "Gh2kd9QpXw3LmN7vRtYa.k3J9xQmPz1VbT6uYhN4oWcE8sA2dF5gLrXiUqZjKvBeM", codeVerifier = "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk", deviceId = "7f3a91c2d4e85b60a1c97e24f8d03b5a")
                println(response)
            }
        - lang: swift
          label: Swift
          source: |-
            import Discovr

            let client = DiscovrClient(clientId: "your-client-id")
            // Response / argument types:
            // RefreshTokenResponse, WebTokenPayload
            let response: RefreshTokenResponse = try await client.exchangeWebAuthCode(clientID: "abc123xyz", code: "Gh2kd9QpXw3LmN7vRtYa.k3J9xQmPz1VbT6uYhN4oWcE8sA2dF5gLrXiUqZjKvBeM", codeVerifier: "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk", deviceId: "7f3a91c2d4e85b60a1c97e24f8d03b5a")
            print(response)
  /auth/session-token:
    post:
      tags:
        - Discovr
        - Authentication
      summary: Mint a session token
      operationId: mintSessionToken
      x-tier: identity
      description: |
        Scopes your browsing session to a specific profile. You'll call this:
        - after sign-in, to pick which profile is active
        - when the user switches to a different profile
        - when the previous session token has expired

        Returns a short-lived session token (valid for 30 minutes) and its expiry time.
        Use this token in the `Authorization` header for all session-tier endpoints — pages, rows, and profile-scoped lists.

        The response also carries a `snapshotId`, which identifies the recommendations
        the user is currently browsing. Send it back on your next call so renewing a
        credential doesn't reshuffle the screen underneath them. Omit it on a first
        sign-in or a profile switch, where there's nothing to carry. Page IDs are
        unaffected either way.

        **Auth tier:** identity — send your refresh token in the `Authorization: Bearer` header.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintSessionTokenPayload"
      responses:
        "200":
          description: A new session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Returned when you send a session token where a refresh token is required (`WRONG_TOKEN_KIND`), or when the `profileId` doesn't belong to the signed-in user (`PROFILE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "405":
          description: Method not allowed.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-codeSamples:
        - lang: javascript
          label: TypeScript
          source: |-
            import { DiscovrClient } from "discovr";
            import type { MintSessionTokenPayload, SessionTokenResponse } from "discovr";

            const discovr = new DiscovrClient("your-client-id");

            // After sign-in …
