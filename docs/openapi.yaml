        episode:
          type: integer
          minimum: 1
          description: Episode number (required for TV shows)
          example: 5
        imported:
          type: string
          description: Source of import (e.g., "trakt") if this item was imported
          nullable: true
          example: trakt
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the item was added to the list
          example: "2023-01-01T00:00:00.000Z"
      additionalProperties: false
    AddSimpleListItemPayload:
      description: The media item to add. Use the full Discovr media ID — `MV_<id>` for movies, `TV_<id>` for TV shows.
      type: object
      required:
        - mediaId
      properties:
        mediaId:
          type: string
          description: |
            Full media ID — `MV_<number>` for movies, `TV_<number>` for TV shows (e.g., `MV_550`).

            Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
          example: MV_550
      additionalProperties: false
    AddPlaybackPayload:
      description: Playback progress to record. `progress` is 0–100. `updatedAt` is an ISO timestamp from the client — use the actual time of the progress update.
      type: object
      required:
        - mediaId
      properties:
        mediaId:
          type: string
          description: |
            Full media ID — `MV_<number>` for movies, `TV_<number>` for TV shows (e.g., `MV_550`).

            Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
          example: MV_550
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Initial playback progress percentage (0-100)
          example: 25.5
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for when playback was last updated
          example: "2023-01-15T00:00:00.000Z"
      additionalProperties: false
    EditPlaybackPayload:
      description: Updated playback progress. Provide at least one of `progress` or `updatedAt`. `mediaId` identifies the entry to update.
      type: object
      required:
        - mediaId
      properties:
        mediaId:
          type: string
          description: |
            Full media ID — `MV_<number>` for movies, `TV_<number>` for TV shows (e.g., `MV_550`).

            Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
          example: MV_550
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: New playback progress percentage (0-100)
          example: 75
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for when playback was last updated
          example: "2023-01-15T00:00:00.000Z"
      additionalProperties: false
    AddHistoryPayload:
      description: A watch history entry to record. For TV shows, `season` is required; `episode` is optional.
      type: object
      required:
        - mediaId
      properties:
        mediaId:
          type: string
          description: |
            Full media ID — `MV_<number>` for movies, `TV_<number>` for TV shows (e.g., `TV_1396`).

            Also accepts an item's `ref` in place of the id. Prefer the `ref` when you have one — it resolves to the same title and sharpens the user's recommendations.
          example: TV_1396
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the history entry was last updated
          example: "2023-01-15T00:00:00.000Z"
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Playback progress percentage (0-100)
          example: 45.5
        season:
          type: integer
          minimum: 1
          description: Season number (required for TV shows)
          example: 1
        episode:
          type: integer
          minimum: 1
          description: |
            Episode number (optional for TV shows). When omitted, creates a "Default for Episode" entry
            that applies to all episodes in the season where episode.air_date < historyItem.updatedAt.
            This allows updating multiple episodes with a single history entry.

            **Overriding Season Defaults:** When provided, creates an explicit episode entry that takes
            precedence over any season default entries. To unmark an episode completed via season default,
            create an explicit entry with progress < 80% (which will not be marked as completed).
          example: 5
        imported:
          type: string
          description: Source of import (e.g., "trakt") if this item was imported
          example: trakt
      additionalProperties: false
    SimpleListResponse:
      description: Paginated list of items. Use `nextPageToken` with the `nextPageToken` query parameter to get the next page.
      type: object
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          description: Array of list items
          items:
            $ref: "#/components/schemas/SimpleListItem"
        hasMore:
          type: boolean
          description: Whether there are more items available
          example: true
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    PlaybackListResponse:
      description: Paginated list of items with playback progress.
      type: object
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          description: Array of playback items
          items:
            $ref: "#/components/schemas/PlaybackItem"
        hasMore:
          type: boolean
          description: Whether there are more items available
          example: true
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    HistoryListResponse:
      description: Paginated list of watch history entries.
      type: object
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          description: Array of history items
          items:
            $ref: "#/components/schemas/HistoryItem"
        hasMore:
          type: boolean
          description: Whether there are more items available
          example: true
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    SuccessMessage:
      description: Confirmation response with the action taken. For exclusive lists (liked/disliked/super_liked), also includes `added` (which list the item was added to) and optionally `removed` (which list it was removed from).
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Success message
          example: Item added successfully
        added:
          type: string
          description: The list type the item was added to (for exclusive lists)
          example: liked
        removed:
          type: string
          nullable: true
          description: The list type the item was removed from, if any (for exclusive lists)
          example: disliked
      additionalProperties: false
    ScrobbleProgressPayload:
      type: object
      description: Reports how far through a title the viewer is. Send this as the user watches.
      required:
        - mediaId
        - progress
      properties:
        mediaId:
          type: string
          description: The media ID in `MV_<number>` or `TV_<number>` format (e.g., `MV_550`, `TV_1396`).
          example: TV_1396
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Current playback position as a percentage (0–100).
          example: 42.5
        tv:
          description: Which episode is playing. Required for TV shows, omitted for movies.
          $ref: "#/components/schemas/ScrobbleTv"
      additionalProperties: false
    ScrobbleResponse:
      type: object
      description: Confirms a progress report, echoing what was recorded and whether it counted as watched.
      required:
        - status
        - progress
        - completed
      properties:
        status:
          type: string
          description: Always `"ok"` on success.
          example: ok
        progress:
          type: number
          description: The progress value recorded (0–100).
          minimum: 0
          maximum: 100
          example: 85
        completed:
          type: boolean
          description: "`true` if the item was marked as watched (progress reached 80% or more)."
          example: true
      additionalProperties: false
    ScrobbleSkipResponse:
      type: object
      description: Confirms a skip report was recorded.
      required:
        - status
      properties:
        status:
          type: string
          description: Always `"ok"` on success.
          example: ok
      additionalProperties: false
    ApiError:
      type: object
      description: An API error response. `error` is either a machine-readable code or a plain description of what went wrong. The SDKs translate the codes into typed errors, so most apps never read it directly.
      required:
        - error
      properties:
        error:
          type: string
          description: |
            Why the request failed. Authentication endpoints return one of these codes:
            `session-expired`, `session-already-consumed`, `session-not-found`,
            `client-not-found`, `client-mismatch`, `device-code-not-found`,
            `device-code-expired`, `device-code-already-consumed`,
            `device-code-denied`, `code-verifier-invalid`, `token-invalid`. Other endpoints return a
            plain description.
          example: device-code-expired
      additionalProperties: true
    RateLimitedError:
      type: object
      description: |
        A `429` body. Same shape as `ApiError` plus the wait hint, which `ApiError`
        can't carry because it forbids extra properties — a strict validator would
        reject the very body every limiter sends.
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable error code. Always `RATE_LIMITED` for a `429`.
          example: RATE_LIMITED
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Seconds until the current limit window rolls over. Mirrors the `Retry-After` header.
          example: 14
      additionalProperties: false
    Page:
      type: object
      description: A recommendation page containing rows of media titles. Its ID comes from its filters alone, so the same page keeps the same ID for every profile, on every device, indefinitely.
      required:
        - id
        - createdAt
        - hero
      properties:
        id:
          type: string
          description: Stable identifier for the page. Safe to store, bookmark or put in a URL.
        createdAt:
          type: string
          format: date-time
          description: When this view of the page was built. Moves when recommendations refresh; it is not the page's own age.
        hero:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/HeroItem"
          description: Array of exactly 10 featured HeroItems for the hero section
        name:
          type: string
          description: |
            Human-readable page title, suitable for a breadcrumb (e.g. "Movies & Series • Anime • Fantasy").

            Present only for pages that carry their own name — navigation tiles and
            built-in pages. A `name` you pass to `POST /pages` is a label for your own
            use and is not returned here. Absent otherwise — read it defensively.
      additionalProperties: false
    Row:
      type: object
      description: A single row within a page — a labeled group of media items with display info and pagination cursor.
      required:
        - id
        - title
        - pageId
        - type
        - index
        - createdAt
      properties:
        id:
          type: string
          description: |
            Opaque reference to this row. Pass it back unchanged to fetch the row's items. It stays valid across a recommendations refresh, so a rail the user has already opened keeps working.
        title:
          type: string
          description: Display title for the row
        pageId:
          type: string
          description: The stable ID of the page this row belongs to — the same value you passed in.
        type:
          $ref: "#/components/schemas/RowType"
          description: Type of row - media rows contain media items, navigation rows contain navigation items, provider rows contain provider items, top_n rows contain media items (same as media rows but distinguished by type)
        index:
          type: integer
          format: int32
          description: Display order of this row within the page (lower values appear first)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
      additionalProperties: false
    CreatePagePayload:
      type: object
      description: Optional filters to shape the recommendation page. Omit for a default page based on the profile's full taste history.
      properties:
        pageFilters:
          description: Filters that shape which titles appear in the page's rows.
          $ref: "#/components/schemas/FilterSpec"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Optional label for your own use. It doesn't affect the page you get back
            and isn't stored — keep your own mapping from page ID to display name if
            you need one.

            A page's identity comes from its filters alone. Two calls with the same
            filters return the **same page** whatever you call it, so give pages that
            should be distinct distinct filters.
      additionalProperties: false
    CreatePageResponse:
      type: object
      description: The page's ID and the filters it stands for. Pass the `id` to `GET /pages/{pageId}` or `GET /pages/{pageId}/rows`.
      required:
        - id
      properties:
        id:
          type: string
          description: Stable identifier for the page. Safe to bookmark, store, or put in a URL.
        pageFilters:
          description: Filters that shape which titles appear in the page's rows.
          $ref: "#/components/schemas/FilterSpec"
      additionalProperties: false
    GetRowsResponse:
      type: object
      description: Paginated list of rows for the page.
      required:
        - rows
        - hasMore
      properties:
        rows:
          type: array
          description: Rows in this page, in the order they should be rendered.
          items:
            $ref: "#/components/schemas/Row"
        hasMore:
          type: boolean
          description: Whether there are more rows available
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    GetRowItemsResponse:
      type: object
      description: Paginated list of items within a row.
      required:
        - items
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RowItem"
          description: Array of row items - can be MediaItem, NavigationItem, or ProviderItem based on the row type
        hasMore:
          type: boolean
          description: Whether there are more items available
        nextPageToken:
          type: string
          description: Opaque token to fetch the next page of results
      additionalProperties: false
    MediaItem:
      type: object
      description: A media item in a recommendation row, with display metadata.
      required:
        - id
        - title
        - overview
        - media_type
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the media item
        title:
          type: string
          description: Title of the media item
        overview:
          type: string
          nullable: true
          description: Synopsis/summary text for this title.
        poster_path:
          type: object
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        backdrop_path:
          type: object
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        media_type:
          type: string
          enum:
            - movie
            - tv
          description: Type of media
        year:
          type: integer
          description: Release year (the first air year for TV). Absent when the title has no date.
          example: 1999
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Average viewer rating out of 10, to one decimal. Absent until a title has votes.
          example: 8.4
        genres:
          type: array
          items:
            type: string
          description: Genre names, most relevant first. Absent when none are known.
          example:
            - Drama
            - Thriller
        type:
          $ref: "#/components/schemas/MediaItemType"
          description: Discriminator field indicating this is a media item
        ref:
          type: string
          description: |
            This item's `id` with the place it was shown attached.

            Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, adding it to a list, scrobbling it. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            A bare `id` always works; `ref` is never required.
          example: MV_550@Lw2rC9sYh5TaB8kF
      additionalProperties: false
    FilterSpec:
      type: object
      description: Filters that shape which titles appear in a page's rows. All filters are optional.
      properties:
        genres:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          description: Genre IDs to filter by
        keywords:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
          description: Keyword IDs to filter by
        media_type:
          type: string
          enum:
            - movie
            - tv
            - all
          description: Media type filter
        region:
          type: array
          items:
            type: string
            minLength: 1
          description: Region codes (e.g., "US", "GB")
        with_runtime_gte:
          type: integer
          nullable: true
          format: int32
          minimum: 0
          description: Minimum runtime in minutes
        with_runtime_lte:
          type: integer
          nullable: true
          format: int32
          minimum: 0
          description: Maximum runtime in minutes
        with_release_date_gte:
          type: string
          nullable: true
          format: date
          description: Earliest release date (YYYY-MM-DD)
        with_release_date_lte:
          type: string
          nullable: true
          format: date
          description: Latest release date (YYYY-MM-DD)
        with_watch_providers:
          type: array
          items:
            type: string
            minLength: 1
          description: Streaming provider IDs
      additionalProperties: false
    MediaResponse:
      type: object
      description: Full details for a movie or TV show.
      required:
        - id
        - media_type
      properties:
        id:
          type: string
          description: The unique identifier of the media item.
        media_type:
          type: string
          enum:
            - movie
            - tv
          description: Whether this is a movie or TV show.
        movie:
          title: MediaResponseMovie
          type: object
          description: Movie details — only present when `media_type` is `movie`.
          properties:
            id:
              type: string
              description: The Discovr media ID for this movie — the `MV_<id>` value you pass to other endpoints.
            tmdb_id:
              type: integer
              description: Catalogue identifier for this movie, without the `MV_` prefix.
            title:
              type: string
              description: Display title, localised where a translation is available.
            original_title:
              type: string
              description: Title in the movie's original language. Differs from `title` for translated releases.
            overview:
              type: string
              description: Short synopsis, suitable for a detail sheet.
            poster_path:
              type: object
              description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
              additionalProperties:
                type: string
                format: uri
              example:
                w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
              nullable: true
            backdrop_path:
              type: object
              description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
              additionalProperties:
                type: string
                format: uri
              example:
                w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
              nullable: true
            release_date:
              type: string
              format: date
              description: Theatrical or first release date, as `YYYY-MM-DD`.
            runtime:
              type: integer
              description: Length in whole minutes.
            vote_average:
              type: number
              description: Average audience rating out of 10.
            vote_count:
              type: integer
              description: How many ratings `vote_average` is based on — useful for deciding whether to show the score at all.
            popularity:
              type: number
              description: Relative popularity score. Comparable between titles, but has no fixed upper bound, so treat it as a sort key rather than something to display.
            genres:
              type: array
              description: Genres this movie belongs to.
              items:
                title: MediaResponseMovieGenre
                type: object
                properties:
                  tmdb_id:
                    type: integer
                    description: Genre identifier. Pass this as a `genres` filter when creating a page.
                  name:
                    type: string
                    description: Display name of the genre.
            tagline:
              type: string
              description: Short marketing line, where one exists.
            status:
              type: string
              description: Release status, such as `Released`, `In Production`, or `Post Production`.
            budget:
              type: integer
              description: Production budget in US dollars. `0` when unknown.
            revenue:
              type: integer
              description: Worldwide box office in US dollars. `0` when unknown.
            homepage:
              type: string
              description: Official site for the movie, where one exists.
            imdb_id:
              type: string
              description: IMDb identifier, for linking out to IMDb.
        tv:
          title: MediaResponseTv
          type: object
          description: TV show details — only present when `media_type` is `tv`.
          properties:
            id:
              type: string
              description: The Discovr media ID for this show — the `TV_<id>` value you pass to other endpoints.
            tmdb_id:
              type: integer
              description: Catalogue identifier for this show, without the `TV_` prefix.
            name:
              type: string
              description: Display name, localised where a translation is available.
            original_name:
              type: string
              description: Name in the show's original language. Differs from `name` for translated releases.
            overview:
              type: string
              description: Short synopsis, suitable for a detail sheet.
            poster_path:
              type: object
              description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
              additionalProperties:
                type: string
                format: uri
              example:
                w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
              nullable: true
            backdrop_path:
              type: object
              description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
              additionalProperties:
                type: string
                format: uri
              example:
                w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
              nullable: true
            first_air_date:
              type: string
              format: date
              description: Date the first episode aired, as `YYYY-MM-DD`.
            last_air_date:
              type: string
              format: date
              description: Date the most recent episode aired, as `YYYY-MM-DD`.
            number_of_episodes:
              type: integer
              description: Total episodes released across every season.
            number_of_seasons:
              type: integer
              description: Total seasons released.
            vote_average:
              type: number
              description: Average audience rating out of 10.
            vote_count:
              type: integer
              description: How many ratings `vote_average` is based on — useful for deciding whether to show the score at all.
            popularity:
              type: number
              description: Relative popularity score. Comparable between titles, but has no fixed upper bound, so treat it as a sort key rather than something to display.
            genres:
              type: array
              description: Genres this show belongs to.
              items:
                title: MediaResponseTvGenre
                type: object
                properties:
                  tmdb_id:
                    type: integer
                    description: Genre identifier. Pass this as a `genres` filter when creating a page.
                  name:
                    type: string
                    description: Display name of the genre.
            tagline:
              type: string
              description: Short marketing line, where one exists.
            status:
              type: string
              description: Production status, such as `Returning Series`, `Ended`, or `Canceled`.
            homepage:
              type: string
              description: Official site for the show, where one exists.
            in_production:
              type: boolean
              description: Whether more episodes are still being made.
            seasons:
              type: array
              description: Every season of the show, including specials as season `0` where one exists.
              items:
                title: MediaResponseTvSeason
                type: object
                properties:
                  tmdb_id:
                    type: integer
                    description: Catalogue identifier for this season.
                  name:
                    type: string
                    description: Display name of the season, such as `Season 1` or `Specials`.
                  episode_count:
                    type: integer
                    description: Episodes in this season.
                  season_number:
                    type: integer
                    description: Position of the season, starting at `1`. Specials use `0`. Pass this to `getSeasonDetails`.
                  air_date:
                    type: string
                    format: date
                    description: Date the season's first episode aired, as `YYYY-MM-DD`.
                  poster_path:
                    type: object
                    description: Season poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
                    additionalProperties:
                      type: string
                      format: uri
                    example:
                      w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                      w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                      original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
                    nullable: true
        watch_providers:
          type: array
          description: |
            Full list of where this title is available, not filtered to any profile's preferences. Use `profile_meta` with `providers=true` for a personalized, preference-filtered provider list. Provider data sourced from JustWatch.
          items:
            $ref: "#/components/schemas/ProviderInfo"
    MediaProfileMeta:
      type: object
      description: The current profile's interaction data for a title.
      properties:
