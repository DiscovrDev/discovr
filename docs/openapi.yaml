        - Misc
      summary: Search GIFs
      x-tier: public
      security: []
      description: |
        Searches for animated GIFs by keyword. Use the `contentfilter` parameter to control content safety (`off`, `low`, `medium`, `high`); if you omit it, the filtering configured for Discovr's Klipy account applies, which is not a fixed level, so pass it explicitly when you need a guaranteed one. Results are paginated — pass `next` from the previous response as `pos` to load more.

        Each result's `url` is the full-size file — an **MP4 whenever one is available**, otherwise a GIF or WebP. Read `media_type` (on the item and on `preview`) to pick a video player or an image view instead of guessing from the URL; it uses the same `AvatarMediaType` values as profiles. `preview` is a lighter file for grids, `still` is a JPEG still frame for Reduce Motion or static grids, and `placeholder` is a tiny blurred `data:` URI to show while the file loads. Save `url` for the one the user picks.

        Klipy attribution is required wherever you show these results.

        No authentication required.
      operationId: searchGifs
      x-cache-policy: ttl:3600
      parameters:
        - name: q
          in: query
          required: true
          description: Search term.
