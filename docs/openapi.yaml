  /gif-search:
    get:
      tags:
        - Discovr
        - Misc
      summary: Search GIFs
      x-tier: public
      security: []
      description: |
        Searches for animated GIFs by keyword. Use the `contentfilter` parameter to control content safety (`off`, `low`, `medium`, `high`); if you omit it, the filtering configured for Discovr's Klipy account applies, which is not a fixed level, so pass it explicitly when you need a guaranteed one. Results are paginated — pass `next` from the previous response as `pos` to load more.

        Each result's `url` is the full-size file and is an **MP4 whenever one is available**, otherwise a GIF, so render it with a video player or an image view according to its file extension (see `avatarMediaType` on profiles). `preview.url` is a lighter version for grids; use it for thumbnails and save `url` only for the one the user picks.

        Klipy attribution is required wherever you show these results.

        No authentication required.
      operationId: searchGifs
      x-cache-policy: ttl:3600
      parameters:
        - name: q
          in: query
          required: true
          description: Search term.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: happy dance
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return (1–50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
        - name: pos
          in: query
          required: false
          description: Pagination cursor from the `next` field of the previous response. Omit to start from the beginning.
          schema:
            type: string
          example: "1:20"
        - name: contentfilter
          in: query
          required: false
          x-ts-coerce: any
          description: Content safety level. `high` is the most restrictive; `off` applies no filtering. Omit it and Discovr's default filtering applies, not a fixed level.
          schema:
            type: string
            enum:
              - high
              - medium
              - low
              - "off"
          example: medium
        - name: country
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country code for regional content preferences (e.g., `US`). Takes precedence over `locale`.
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            example: US
          example: US
        - name: locale
          in: query
          required: false
          description: Only its region part is used (`en_US` is treated as `US`), and only when `country` is not sent.
          schema:
            type: string
            example: en_US
          example: en_US
      responses:
        "200":
          description: GIF results returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GifSearchResponse"
              example:
                items:
                  - id: "12345678"
                    url: https://static.klipy.com/example.gif
                    preview:
                      url: https://static.klipy.com/preview.gif
                      width: 200
                      height: 200
                    description: Happy Dance
                    tags:
                      - happy
                      - dance
                      - celebration
                    width: 498
                    height: 498
                    createdAt: "2024-01-15T10:30:00.000Z"
                next: "1:20"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-codeSamples:
        - lang: javascript
          label: TypeScript
          source: |-
            import { DiscovrClient } from "discovr";
            import type { GifSearchResponse } from "discovr";

            const discovr = new DiscovrClient("your-client-id");

            const response: GifSearchResponse = await discovr.searchGifs("happy dance", { limit: 20, pos: "1:20", contentfilter: "medium", country: "US", locale: "en_US" });
            console.log(response);
        - lang: kotlin
          label: Kotlin
          source: |-
            import api.discovr.DiscovrClient
            import api.discovr.models.GifSearchResponse

            // Construct DiscovrClient with your AuthStorage implementation (see SDK README).
            suspend fun example(client: DiscovrClient) {
                val response: GifSearchResponse = client.searchGifs(q = "happy dance", limit = 20, pos = "1:20", contentfilter = DiscovrApi.ContentfilterSearchGifs.high, country = "US", locale = "en_US")
                println(response)
            }
        - lang: swift
          label: Swift
          source: |-
            import Discovr

            let client = DiscovrClient(clientId: "your-client-id")
            // Response / argument types:
            // GifSearchResponse
            let response: GifSearchResponse = try await client.searchGifs(q: "happy dance", limit: 20, pos: "1:20", contentfilter: DiscovrAPI.Contentfilter_searchGifs.high, country: "US", locale: "en_US")
            print(response)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Which token you send depends on the tier:

        - **Identity tier** (`/profiles`, `/auth/session-token`, `/auth/session`)
          — your refresh token (`rt_<hex>`), valid for 90 days.
        - **Session tier** (`/pages/*`, `/profile/*`) — the session token
          returned by `POST /auth/session-token`, valid for 30 minutes.

        Format: `Authorization: Bearer {token}`

        Using an SDK? You never set this header yourself. Sign in, select a
        profile, and the SDK sends the right token on every call and renews it
        before it runs out.

        **Just want to try these endpoints?** Grab a temporary demo token from
        Developer Options in your [dashboard](https://discovr.media/dashboard)
        and paste it here — no sign-up needed. The dialog gives you both tokens
        above; use the refresh token for identity-tier endpoints and the session
        token for session-tier ones.

        Step-by-step, including which endpoints want a `clientId` instead:
        [How to get playground credentials](https://docs.discovr.media/guides/getting-started/try-it-in-the-docs).
  schemas:
    DeviceCodePayload:
      type: object
      description: Request body for starting the device code flow.
      required:
        - clientID
      properties:
        clientID:
          type: string
          description: Your registered app ID.
          example: abc123xyz
        demo:
          type: boolean
          description: |
            Set when the requesting SDK is configured with demo mode, so the sign-in
            screen offers "Continue as Demo" as an alternative to a real sign-in.
            Defaults to false.
          default: false
      additionalProperties: false
    DeviceCodeResponse:
      type: object
      description: |
        Contains the codes needed for device authentication. Display `userCode` on screen and use `authQRCode` as an image source.
        Returned when `format=json` (the default). With `format=image`, the response is a binary PNG instead.
      required:
        - deviceCode
        - userCode
        - authQRCode
        - verificationUrl
        - expiresIn
        - interval
      properties:
        deviceCode:
          type: string
          description: |
            The code that identifies this authorization request. Pass it to the poll endpoint.
            It is the secret you poll with, so keep it on the device: it is never shown to the person, never put in the QR code, and never needed by the phone.
          example: dvc_abc123xyz789
        userCode:
          type: string
          description: |
            A short numeric code for the user to type if they can't scan the QR code. Show it on screen.
            The QR code carries this code and nothing else.
          pattern: ^[0-9]{4}$
          example: "1234"
        authQRCode:
          type: string
          description: |
            A ready-to-display QR code image as a base64 data URL. Set it as the `src` of an `<img>` tag — no extra processing needed.
          format: uri
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        verificationUrl:
          type: string
          format: uri
          description: |
            The page where someone types `userCode` when they can't scan the QR code. Show it on screen next to the code.
          example: https://discovr.media/tv-auth
        expiresIn:
          type: integer
          description: How long the device code is valid, in milliseconds.
          example: 600000
        interval:
          type: integer
          minimum: 1
          description: |
            How many seconds to wait between polls. The SDKs follow it for you. Every pending
            poll repeats it and may raise it, so a device that has been waiting a while polls less often.
          example: 5
      additionalProperties: false
    RefreshTokenResponse:
      type: object
      description: |
        Returned when a sign-in completes: the device code was confirmed, or a web sign-in's authorization code was redeemed.
        Store the `refreshToken` securely — it's your long-lived credential.
        Call `POST /auth/session-token` with a `profileId` to get a session token and start browsing.
      required:
        - refreshToken
        - publicId
        - expiresAt
      properties:
        refreshToken:
          type: string
          description: |
            Your long-lived credential (valid for 90 days). Use it as the bearer for identity-tier endpoints and to mint session tokens.
            Keep it secure — treat it like a password and never put it in URLs.
          example: rt_a1b2c3d4e5f6...
        publicId:
          type: string
          description: An identifier for this device's sign-in. There's no way to target it directly — call `DELETE /auth/session` from this device to sign it out.
          example: MqXYz12abc
        expiresAt:
          type: integer
          format: int64
          description: When the refresh token expires, as a Unix timestamp (seconds).
          example: 1733088000
      additionalProperties: false
    MintSessionTokenPayload:
      type: object
      description: The profile to scope the session to.
      required:
        - profileId
      properties:
        profileId:
          type: string
          description: The ID of the profile to activate. Must belong to the signed-in user.
          example: profile_abc123
        ttlMs:
          type: integer
          description: |
            Override the session token's lifetime, in milliseconds. Can only shorten it below the default (30 minutes) — never lengthen it. Whether or not you send this, a session token never outlives the refresh token that minted it, so a demo sandbox's session token ends with the sandbox.
          example: 120000
        snapshotId:
          type: string
          description: |
            The `snapshotId` from your previous session token. Pass it to keep the user's recommendations where they were — renewing a session token is routine, and shouldn't reshuffle the screen underneath them.

            Omit it on a first sign-in, or when switching profiles — there's nothing to carry over in either case. Recommendations refresh on their own roughly every 30 minutes.
          example: Wm4rT9xKq2Lv7BnD
      additionalProperties: false
    SessionTokenResponse:
      type: object
      description: The session token scoped to the selected profile. Valid for 30 minutes.
      required:
        - sessionToken
        - snapshotId
        - expiresAt
      properties:
        sessionToken:
          type: string
          description: |
            Your session credential, valid for 30 minutes. Send it as the bearer in the `Authorization` header for all session-tier endpoints (`/pages/*`, `/profile/*`).
          example: sess_4f9c1a7e2b...
        snapshotId:
          type: string
          description: |
            Identifies the set of recommendations the user is currently browsing. Keep it and send it back on your next call to this endpoint, so renewing their credential doesn't reshuffle what they're looking at.

            Recommendations refresh roughly every 30 minutes; when they do, this value changes and pages come back re-ranked. Page IDs are unaffected.
          example: Wm4rT9xKq2Lv7BnD
        expiresAt:
          type: integer
          format: int64
          description: When the session token expires, as a Unix timestamp (seconds).
          example: 1733091000
      additionalProperties: false
    AvatarMediaType:
      type: string
      description: |
        What kind of file `avatarUrl` points at, as a MIME type. Use it to choose between an image view and a video player, and to decide what can be animated, instead of guessing from the URL, since uploads have no file extension. `image/gif`, `video/mp4` and `video/webm` are animated; the others are still.

        On a profile it is absent when the type couldn't be determined; treat that as a still image. When you create or update a profile it is optional: Discovr works it out from the URL's file extension, so send it only when your URL has none. It can only be sent together with `avatarUrl`, and changing `avatarUrl` replaces it (or clears it when the new URL can't be typed), so it never describes the previous picture.
      enum:
        - image/png
        - image/jpeg
        - image/webp
        - image/gif
        - video/mp4
        - video/webm
      example: image/png
    CreateProfilePayload:
      type: object
      description: Name and avatar for the new profile.
      required:
        - name
        - avatarUrl
      properties:
        name:
          type: string
          description: The display name for the profile.
          example: Sci-Fi Lover
        avatarUrl:
          type: string
          description: URL of the profile avatar image.
          format: uri
          example: https://example.com/avatar.jpg
        avatarMediaType:
          $ref: "#/components/schemas/AvatarMediaType"
      additionalProperties: false
    CreateProfileResponse:
      type: object
      description: Contains the ID of the newly created profile. Use it with `POST /auth/session-token` to start browsing.
      required:
        - profileId
      properties:
        profileId:
          type: string
          description: The ID of the newly created profile.
          example: profile_abc123xyz
      additionalProperties: false
    Profile:
      type: object
      description: A Discovr profile with its display info and creation timestamp.
      required:
        - id
        - name
        - avatarUrl
        - createdAt
      properties:
        id:
          type: string
          description: The unique ID of the profile.
          example: profile_abc123xyz
        name:
          type: string
          description: The profile's display name.
          example: Sci-Fi Lover
        avatarUrl:
          type: string
          description: URL of the profile's avatar image.
          format: uri
          example: https://example.com/avatar.jpg
        avatarMediaType:
          $ref: "#/components/schemas/AvatarMediaType"
        createdAt:
          type: string
          format: date-time
          description: When the profile was created, as an ISO 8601 timestamp.
          example: "2023-01-01T00:00:00.000Z"
      additionalProperties: false
    GetProfilesResponse:
      type: object
      description: List of profiles for the signed-in user.
      required:
        - profiles
      properties:
        profiles:
          type: array
          description: Profiles for the signed-in user, ordered by creation date (newest first).
          items:
            $ref: "#/components/schemas/Profile"
          example:
            - id: profile_abc123xyz
              name: Sci-Fi Lover
              avatarUrl: https://example.com/avatar.jpg
              createdAt: "2023-01-01T00:00:00.000Z"
            - id: profile_def456uvw
              name: Action Movie Fan
              avatarUrl: https://example.com/avatar2.jpg
              createdAt: "2023-01-02T00:00:00.000Z"
      additionalProperties: false
    UpdateProfilePayload:
      type: object
      description: Fields to update on the profile. All fields are optional — provide only what's changing. At least one must be present.
      properties:
        name:
          type: string
          description: New display name for the profile.
          example: Action Movie Fan
        avatarUrl:
          type: string
          description: New avatar URL for the profile.
          format: uri
          example: https://example.com/new-avatar.jpg
        avatarMediaType:
          $ref: "#/components/schemas/AvatarMediaType"
      additionalProperties: false
    DeleteProfileResponse:
      type: object
      description: Confirmation that the profile was deleted.
      required:
        - message
      properties:
        message:
          type: string
          description: A confirmation message.
          example: Profile deleted successfully
      additionalProperties: false
    SimpleListItem:
      description: A media item in a profile list, with its display metadata (title, poster, backdrop) and when it was added.
      type: object
      required:
        - id
        - mediaType
        - title
        - poster_path
        - backdrop_path
        - createdAt
      properties:
        id:
          type: string
          description: The DiscovrID (TV_<number> or MV_<number>)
          example: MV_550
        ref:
          type: string
          description: |
            This item's `id` with the list it came from attached.

            Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, removing it from a list. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            A bare `id` always works; `ref` is never required.
          example: MV_550@Pc1tD7vKj3NxU6eO
        mediaType:
          type: string
          enum:
            - movie
            - tv
          description: The type of media
          example: movie
        title:
          type: string
          description: The title of the media
          example: Fight Club
        poster_path:
          type: object
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        backdrop_path:
          type: object
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the item was added to the list
          example: "2023-01-01T00:00:00.000Z"
      additionalProperties: false
    PlaybackItem:
      description: A media item with playback progress. `progress` is 0–100.
      type: object
      required:
        - id
        - mediaType
        - title
        - poster_path
        - backdrop_path
        - createdAt
      properties:
        id:
          type: string
          description: The DiscovrID (TV_<number> or MV_<number>)
          example: MV_550
        ref:
          type: string
          description: |
            This item's `id` with the list it came from attached.

            Prefer it wherever you'd pass this item's `id` onward — opening its detail screen, scrobbling it, removing it from a list. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            A bare `id` always works; `ref` is never required.
          example: MV_550@Zi9bF4wSm0QaT2hC
        mediaType:
          type: string
          enum:
