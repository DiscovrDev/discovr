  /profile/liked:
    get:
      tags:
        - Discovr
        - Profile Lists
      x-sdk-group: Likes
      summary: Get liked items
      description: |
        Returns the liked list for a specific profile.

        **Auth tier:** session — send the session token from `POST /auth/session-token`.

        Items are ordered newest-first and support cursor-based pagination via `nextPageToken`.

        **Pagination:**
        - Pass `nextPageToken` from a previous response to fetch the next page.
        - If `hasMore` is `true`, there are more items available.

        **Exclusive lists:**
        Liked, disliked, and super-liked are mutually exclusive — a title can only be in one of those lists at a time.
      operationId: getLikedItems
      x-cache-policy: none
      security:
        - BearerAuth: []
      parameters:
        - name: nextPageToken
          in: query
          required: false
          description: Opaque token from previous page for pagination
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Maximum number of items to return (1-50, default: 10)"
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: List of liked items retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
