        title:
          type: string
          description: Title of the provider (streaming service name)
        page_id:
          type: string
          description: ID of the page this provider item links to
        ref:
          type: string
          description: |
            This tile's `page_id` with the place it was shown attached.

            Prefer it over `page_id` when opening the page this tile links to. It resolves to the same page and sharpens the user's recommendations. Use it for the profile it was returned to.

            A bare `page_id` always works; `ref` is never required.
          example: k7Qm2xR9pT@Ju4nE1oZd6XcV3gP
        type:
          $ref: "#/components/schemas/ProviderItemType"
          description: Discriminator field indicating this is a provider item
        paths:
          type: object
          description: Square Logo URLs in various resolutions (keys are resolution IDs like "60", "100", "512", "1024")
          additionalProperties:
            type: string
            format: uri
          example:
            "60": https://is1-ssl.mzstatic.com/image/thumb/.../60x60bb.jpg
            "100": https://is1-ssl.mzstatic.com/image/thumb/.../100x100bb.jpg
            "512": https://is1-ssl.mzstatic.com/image/thumb/.../512x512bb.jpg
            "1024": https://is1-ssl.mzstatic.com/image/thumb/.../1024x1024bb.png
      additionalProperties: false
    RowItem:
      oneOf:
        - $ref: "#/components/schemas/MediaItem"
        - $ref: "#/components/schemas/NavigationItem"
        - $ref: "#/components/schemas/ProviderItem"
      discriminator:
        propertyName: type
        mapping:
          media: "#/components/schemas/MediaItem"
          navigation: "#/components/schemas/NavigationItem"
          provider: "#/components/schemas/ProviderItem"
      description: |
        A row item can be a MediaItem, NavigationItem, or ProviderItem.
        Use the `type` field to determine which type it is:
        - `type: "media"` indicates a MediaItem (has `media_type` field)
        - `type: "navigation"` indicates a NavigationItem (has `page_id` field)
        - `type: "provider"` indicates a ProviderItem (has `paths` field with resolution URLs)
    ScrobbleTv:
      type: object
      description: Episode context for TV show scrobbles.
      required:
        - season
        - episode
      properties:
        season:
          type: integer
          minimum: 1
          description: Season number.
          example: 2
        episode:
          type: integer
          minimum: 1
          description: Episode number.
          example: 5
      additionalProperties: false
    ScrobbleProgressBody:
      type: object
      description: Body form of a progress report, for the route that already carries the title in its path.
      required:
        - progress
      properties:
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Current playback position as a percentage (0–100).
          example: 42.5
        tv:
          description: Which episode is playing. Required for TV shows, omitted for movies.
          $ref: "#/components/schemas/ScrobbleTv"
      additionalProperties: false
    ScrobbleSkipBody:
      type: object
      description: Body form of a skip report, for the route that already carries the title in its path.
      required:
        - from
        - to
        - duration
      properties:
        from:
          type: number
          minimum: 0
          maximum: 100
          description: Playback position where the skip started (0–100).
          example: 10
        to:
          type: number
          minimum: 0
          maximum: 100
          description: Playback position where the skip landed (0–100).
          example: 20
        duration:
          type: number
          minimum: 0
          description: Number of seconds skipped.
          example: 20
        tv:
          description: Which episode is playing. Required for TV shows, omitted for movies.
          $ref: "#/components/schemas/ScrobbleTv"
      additionalProperties: false
    PatchHistoryPayload:
      type: object
      description: Updates the recorded progress for a title already in the profile's history.
      required:
        - progress
      properties:
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Playback progress percentage (0-100). 

            Values >= 80% are considered completed, values < 80% are not completed.
            Use progress: 0 to unmark an episode that was completed via season default.
          example: 0
      additionalProperties: false
    ProviderInfo:
      type: object
      description: A streaming service and the regions where this title is available on it.
      required:
        - id
        - title
        - logos
        - regions
      properties:
        id:
          type: string
          description: Provider identifier.
          example: "119"
        title:
          type: string
          description: Display name of the streaming service.
          example: Amazon Prime Video
        logos:
          type: object
          description: Square logo images at various sizes, keyed by pixel dimension.
          additionalProperties:
            type: string
            format: uri
          example:
            "60": https://is1-ssl.mzstatic.com/image/thumb/.../60x60bb.jpg
            "100": https://is1-ssl.mzstatic.com/image/thumb/.../100x100bb.jpg
            "512": https://is1-ssl.mzstatic.com/image/thumb/.../512x512bb.jpg
            "1024": https://is1-ssl.mzstatic.com/image/thumb/.../1024x1024bb.png
        regions:
          type: object
          description: |
            Regions where this provider has the title available, keyed by ISO 3166-1 alpha-2 country code.
          additionalProperties:
            title: ProviderInfoRegion
            type: object
            required:
              - english_name
              - native_name
              - link
            properties:
              english_name:
                type: string
                description: English name of the region.
                example: United States
              native_name:
                type: string
                description: Region name in the local language.
                example: United States
              link:
                type: string
                format: uri
                description: Link to the watch page for this title in this region.
                example: https://example.com/movie/550/watch?locale=US
    schemas_PlaybackItem:
      type: object
      description: A title the profile has started but not finished, with how far through they are.
      required:
        - mediaId
        - mediaType
        - createdAt
      properties:
        mediaId:
          type: string
          description: The title being tracked, as `MV_<id>` or `TV_<id>`.
        mediaType:
          type: string
          enum:
            - movie
            - tv
          description: Whether this is a movie or TV show.
        createdAt:
          type: string
          format: date-time
          description: When the profile first started this title.
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: How far through the title the profile is, as a percentage. Use it to position a progress bar.
        updatedAt:
          type: string
          format: date-time
          description: When progress was last recorded. Sort by this to order a Continue Watching row.
        season:
          type: integer
          minimum: 1
          description: Season number (only for TV shows)
          example: 2
        episode:
          type: integer
          minimum: 1
          description: Episode number (only for TV shows)
          example: 5
    FreeformObject:
      type: object
      description: An untyped, provider-dependent object. Shape varies by item; treat properties as opaque.
      additionalProperties: true
    Episode:
      type: object
      description: Details for a single TV episode.
      required:
        - episode_tmdb_id
        - episode_number
        - name
        - season_number
        - show_id
      properties:
        episode_tmdb_id:
          type: integer
          description: Numeric identifier for the episode.
          example: 63056
        episode_number:
          type: integer
          description: Episode number within the season.
          example: 1
        name:
          type: string
          description: Episode title.
          example: Winter Is Coming
        overview:
          type: string
          description: Episode synopsis.
          nullable: true
        still_path:
          type: object
          description: Episode still image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        air_date:
          type: string
          format: date
          description: Original air date of the episode.
          example: "2011-04-17"
          nullable: true
        runtime:
          type: integer
          description: Episode runtime in minutes.
          example: 62
          nullable: true
        season_number:
          type: integer
          description: Season this episode belongs to.
          example: 1
        show_id:
          type: integer
          description: Numeric identifier for the parent TV show.
          example: 1396
        production_code:
          type: string
          description: Production code for the episode.
          nullable: true
        vote_average:
          type: number
          description: Community rating for the episode.
          example: 9.1
          nullable: true
        vote_count:
          type: integer
          description: Number of ratings for the episode.
          example: 123
          nullable: true
        crew:
          type: array
          description: Crew members for this episode.
          items:
            $ref: "#/components/schemas/FreeformObject"
          nullable: true
        guest_stars:
          type: array
          description: Guest cast for this episode.
          items:
            $ref: "#/components/schemas/FreeformObject"
          nullable: true
    SeasonDetailsResponse:
      type: object
      description: Detailed information about a TV season, including its episodes.
      required:
        - show_id
        - show_tmdb_id
        - id
        - season_number
        - episodes
      properties:
        show_id:
          type: string
          description: The TV show identifier (e.g., `TV_1396`).
          example: TV_1396
        show_tmdb_id:
          type: integer
          description: Numeric identifier for the TV show.
          example: 1396
        tmdb_internal_id:
          type: string
          description: Image asset identifier for the season.
          example: 57599026c3a368369a000494
          nullable: true
        id:
          type: integer
          description: Season identifier.
          example: 3572
        season_tmdb_id:
          type: integer
          description: Alias for `id`.
          example: 3572
        name:
          type: string
          description: Name of the season
          example: Season 1
        overview:
          type: string
          description: Overview of the season
          nullable: true
        poster_path:
          type: object
          description: Season poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          example:
            w185: https://cdn.example.com/w185/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            w500: https://cdn.example.com/w500/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
            original: https://cdn.example.com/original/kqjL17yufvn9OVLyXYpvtyrFfak.jpg
          nullable: true
        season_number:
          type: integer
          description: The number of the season
          example: 1
        air_date:
          type: string
          format: date
          description: Air date of the season
          example: "2011-04-17"
          nullable: true
        episodes:
          type: array
          description: List of episodes in the season
          items:
            $ref: "#/components/schemas/Episode"
    SeasonProfileMetaEpisode:
      type: object
      description: Whether the current profile has finished a single episode.
      required:
        - episode
        - completed
      properties:
        episode:
          type: integer
          description: The episode number within the season.
          example: 5
        completed:
          type: boolean
          description: Whether the profile has finished this episode (watched at least 80% of it).
    SeasonProfileMeta:
      type: object
      description: The current profile's state for a TV season — which episodes it has finished, plus the season's own aggregate completion state.
      required:
        - season
        - completed
        - episodes
      properties:
        season:
          type: integer
          description: The season number this meta is for.
          example: 1
        completed:
          type: boolean
          description: Whether the profile has completed the entire season.
        episodes:
          type: array
          description: Which episodes of this season the profile has finished.
          items:
            $ref: "#/components/schemas/SeasonProfileMetaEpisode"
    KnownForItem:
      type: object
      description: A title a person is known for, returned alongside `person` search results.
      required:
        - id
        - tmdb_id
        - media_type
      properties:
        id:
          type: string
          description: Unique identifier — `TV_<id>` for TV shows, `MV_<id>` for movies. Ready to pass to `/media/{mediaId}`.
          example: MV_872585
        ref:
          type: string
          description: |
            This title's `id` with the search it came from attached.

            Prefer it wherever you'd pass this title's `id` onward — opening its detail screen, adding it to a list. It works exactly like the `id` and sharpens the user's recommendations. Use it for the profile it was returned to; for anything you share, use the `id`.

            A bare `id` always works; `ref` is never required.
          example: MV_872585@Hd3yW8cBn5JtK1aS
        tmdb_id:
          type: integer
          description: The numeric ID for this title.
          example: 872585
        media_type:
          type: string
          enum:
            - movie
            - tv
          description: Whether this title is a movie or a TV show.
        title:
          type: string
          description: Movie title. TV shows use `name` instead.
          example: Oppenheimer
        name:
          type: string
          description: TV show name. Movies use `title` instead.
        overview:
          type: string
          description: Short synopsis of the title.
        poster_path:
          type: object
          description: Poster image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          nullable: true
        backdrop_path:
          type: object
          description: Backdrop image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
          nullable: true
        release_date:
          type: string
          format: date
          description: Release date, for movies.
        first_air_date:
          type: string
          format: date
          description: First air date, for TV shows.
        vote_average:
          type: number
          description: Average audience rating out of 10.
  responses:
    BadRequest:
      description: The request is missing a required field or contains an invalid value. Check the `error` field for details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: "Missing or invalid required field: clientID"
    Unauthorized:
      description: Authentication failed — the token is missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: Invalid ClientID
    NotFound:
      description: The requested resource wasn't found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: Device code not found
    Conflict:
      description: The request conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: Watched item already exists. Use editWatched to update count.
    InternalServerError:
      description: Something went wrong on Discovr's end. Try again, and contact support if the issue persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: Internal server error
    RateLimited:
      description: Too many requests. Back off and retry after a short delay — limits are scoped per client and per endpoint, so this doesn't affect other clients.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Counted to the end of the current limit window, so it is never longer than it needs to be.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
          examples:
            default:
              value:
                error: RATE_LIMITED
                retryAfterSeconds: 14
    ServiceUnavailable:
      description: The API is temporarily unavailable — an operator-triggered safety measure, not a routine outage. Retry after a delay; check Discovr's status page if this persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: SERVICE_UNAVAILABLE
    CursorExpired:
      description: |
        Your pagination cursor or row reference points at a set of results that has since been replaced. The page itself is fine and its ID is still valid — start its pagination again from the beginning.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: CURSOR_EXPIRED
