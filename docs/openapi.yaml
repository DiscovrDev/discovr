          example: 1
        show_id:
          type: string
          description: The parent TV show identifier (e.g., `TV_1396`).
          example: TV_1396
        production_code:
          type:
            - string
            - "null"
          description: Production code for the episode.
        vote_average:
          type:
            - number
            - "null"
          description: Community rating for the episode.
          example: 9.1
        vote_count:
          type:
            - integer
            - "null"
          description: Number of ratings for the episode.
          example: 123
        crew:
          type: array
          description: Crew members for this episode.
          items:
            $ref: "#/components/schemas/EpisodeCrewMember"
        guest_stars:
          type: array
          description: Guest cast for this episode.
          items:
            $ref: "#/components/schemas/EpisodeGuestStar"
      additionalProperties: false
    EpisodeCrewMember:
      type: object
      description: A crew member credited on an episode.
      required:
        - tmdb_id
        - name
      properties:
        tmdb_id:
          type: integer
          description: Catalogue identifier for this person.
          example: 66633
        name:
          type: string
          description: Display name of the crew member.
          example: Vince Gilligan
        job:
          type:
            - string
            - "null"
          description: Role on the episode, such as `Director` or `Writer`.
          example: Director
        department:
          type:
            - string
            - "null"
          description: Production department, such as `Directing` or `Writing`.
          example: Directing
        profile_path:
          type:
            - object
            - "null"
          description: Headshot image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
      additionalProperties: false
    EpisodeGuestStar:
      type: object
      description: A guest actor credited on an episode.
      required:
        - tmdb_id
        - name
      properties:
        tmdb_id:
          type: integer
          description: Catalogue identifier for this person.
          example: 14329
        name:
          type: string
          description: Display name of the actor.
          example: John Koyama
        character:
          type:
            - string
            - "null"
          description: Character played in the episode.
          example: Emilio Koyama
        order:
          type:
            - integer
            - "null"
          description: Billing order in the episode credits.
          example: 1
        profile_path:
          type:
            - object
            - "null"
          description: Headshot image URLs keyed by width bucket (`w45`, `w92`, `w154`, `w185`, `w300`, `w342`, `w500`, `w780`, `w1280`, `original`).
          additionalProperties:
            type: string
            format: uri
      additionalProperties: false
    ProfileImagesResponse:
      type: object
      description: Available avatar images for profile setup. All are still images.
      required:
        - images
      properties:
        nextToken:
          type: string
          description: Pass this back as the page token to get the next page. Absent on the last page.
        images:
          type: array
          description: Direct URLs to avatar images. Use any of these as a profile picture.
          items:
            type: string
            format: uri
          example:
            - https://api.discovr.media/profile-images/profile-amber.png
            - https://api.discovr.media/profile-images/profile-sage.png
            - https://api.discovr.media/profile-images/profile-indigo.png
      additionalProperties: false
    GifItem:
      type: object
      description: A single animated GIF result.
      required:
        - id
        - url
        - preview
        - description
        - tags
        - width
        - height
        - createdAt
        - media_type
      properties:
        id:
          type: string
          description: Unique identifier for the GIF.
          example: "12345678"
        url:
          type: string
          format: uri
          description: Direct URL to the full-size file. An MP4 whenever one is available, otherwise a GIF or a WebP. `media_type` says which, so you don't have to guess from the extension.
          example: https://static.klipy.com/example.mp4
        preview:
          description: A smaller, lighter version, for grids and pickers. Usually a GIF or a WebP; falls back to the full-size file when no smaller one exists, so it can be an MP4. Check its `media_type`.
          $ref: "#/components/schemas/GifPreview"
        media_type:
          $ref: "#/components/schemas/AvatarMediaType"
          description: What `url` is, as a MIME type (`video/mp4`, `image/gif` or `image/webp`). Pick a video player or an image view from it.
        still:
          description: A single still frame (`image/jpeg`), for Reduce Motion or for grids that shouldn't animate. Absent when none exists.
          $ref: "#/components/schemas/GifPreview"
        placeholder:
          type: string
          description: A tiny blurred image as a `data:` URI, to show while the real file loads. Absent when none exists.
        description:
          type: string
          description: Title or short description of the GIF.
          example: Happy Dance
        tags:
          type: array
          description: Keywords associated with the GIF.
          items:
            type: string
          example:
            - happy
            - dance
            - celebration
        width:
          type: integer
          description: Width of `url` in pixels.
          example: 498
        height:
          type: integer
          description: Height of `url` in pixels.
          example: 498
        createdAt:
          type: string
          format: date-time
          description: When this result was fetched (ISO 8601).
          example: "2024-01-15T10:30:00.000Z"
      additionalProperties: false
    GifPreview:
      type: object
      description: A secondary rendition of a GIF — either a smaller animated preview for grids (`preview`) or a single still frame (`still`).
      required:
        - url
        - width
        - height
        - media_type
      properties:
        url:
          type: string
          format: uri
          description: URL to this rendition.
          example: https://static.klipy.com/preview.gif
        width:
          type: integer
          description: Width in pixels.
          example: 200
        height:
          type: integer
          description: Height in pixels.
          example: 200
        media_type:
          $ref: "#/components/schemas/AvatarMediaType"
          description: MIME type of this rendition (`image/gif`, `image/webp`, `image/jpeg`, `video/mp4`, or `video/webm`). Pick a video player or an image view from it instead of guessing from the URL.
      additionalProperties: false
    GifSearchResponse:
      type: object
      description: Paginated GIF search results.
      required:
        - items
      properties:
        items:
          type: array
          description: GIF results for the current page.
          items:
            $ref: "#/components/schemas/GifItem"
        next:
          type:
            - string
            - "null"
          description: Pagination cursor — pass as `pos` in your next request to load more results. `null` when there are no more results.
          example: "1:20"
      additionalProperties: false
  responses:
    BadRequest:
      description: The request is missing a required field or contains an invalid value. Check `error` and optional `message` for details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: invalid-input
                message: "Missing or invalid required field: clientID"
    Unauthorized:
      description: Authentication failed — the token is missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: token-invalid
    Forbidden:
      description: "The token is valid but this account can't use the API right now: it's still on the waitlist (`access-not-granted`), has to accept the current Terms (`legal-acceptance-required`), or the profile in the token no longer exists (`profile-not-found`). Re-authenticating won't change the answer; show the user what the `error` code says."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: access-not-granted
    NotFound:
      description: The requested resource wasn't found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: not-found
                message: Resource not found
    Conflict:
      description: The request conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: duplicate
    InternalServerError:
      description: Something went wrong on Discovr's end. Try again, and contact support if the issue persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: internal-error
    RateLimited:
      description: Too many requests. Back off and retry after a short delay — limits are scoped per client and per endpoint, so this doesn't affect other clients.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Counted to the end of the current limit window, so it is never longer than it needs to be.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
          examples:
            default:
              value:
                error: rate-limited
                retryAfterSeconds: 14
    ServiceUnavailable:
      description: The API is temporarily unavailable — an operator-triggered safety measure, not a routine outage. Retry after a delay; check Discovr's status page if this persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: service-unavailable
    CursorExpired:
      description: |
        Your pagination cursor or row reference points at a set of results that has since been replaced. The page itself is fine and its ID is still valid. For rows this is what a recommendation turnover looks like: call `getPage` and `getRows` with no token and replace what you're showing, rather than merging the result into the old list. For a row's items it means the set was cleaned up; start that row's pagination again from the beginning.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                error: cursor-expired
